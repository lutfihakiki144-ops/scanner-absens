<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
  initial-scale=1,
  viewport-fit=cover">

<meta
  name="theme-color"
  content="#eef3ff">

<title>
  QR Scanner
</title>


<script
  src="https://unpkg.com/html5-qrcode"
  defer>
</script>


<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    system-ui,
    sans-serif;

  color:#182235;

  background:
    linear-gradient(
      135deg,
      #edf3ff,
      #ffffff,
      #eef0ff
    );

}


.wrap{

  width:min(
    480px,
    100%
  );

  margin:auto;

  padding:
    12px;

  display:grid;

  gap:12px;

}


.glass{

  background:
    rgba(
      255,
      255,
      255,
      .52
    );

  border:
    1px solid
    rgba(
      255,
      255,
      255,
      .82
    );

  box-shadow:
    0 18px 50px
    rgba(
      55,
      75,
      125,
      .16
    );

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  border-radius:
    25px;

}


/* HEADER */

.header{

  padding:16px;

}


.eyebrow{

  font-size:9px;

  font-weight:800;

  letter-spacing:.16em;

  color:#71809a;

}


.header h1{

  font-size:21px;

  margin:
    5px 0;

}


.online{

  float:right;

  margin-top:-28px;

  color:#168458;

  font-size:10px;

  font-weight:800;

}


/* SCANNER */

.scanner{

  padding:9px;

  border-radius:28px;

}


#reader{

  width:100%;

  aspect-ratio:1;

  overflow:hidden;

  border-radius:21px;

  background:#101622;

}


#reader video{

  width:100%!important;

  height:100%!important;

  object-fit:cover!important;

}


/* CONTROLS */

.controls{

  display:grid;

  grid-template-columns:
    1fr
    auto;

  gap:8px;

}


.controls select,
.controls button{

  height:46px;

  padding:
    0 12px;

  border:0;

  border-radius:15px;

  background:
    rgba(
      255,
      255,
      255,
      .65
    );

  font-weight:700;

}


.controls button{

  color:white;

  background:
    #527cff;

}


/* INFO */

.info{

  padding:15px;

}


.info b{

  font-size:12px;

}


.info p{

  margin:
    6px 0 0;

  color:#71809a;

  font-size:10px;

  line-height:1.5;

}


/* RESULT */

.result{

  padding:15px;

  text-align:center;

  font-size:11px;

  font-weight:800;

}


/* DESKTOP */

@media(min-width:700px){

  body{

    display:grid;

    place-items:center;

    min-height:100vh;

  }

}

</style>

</head>


<body>


<div class="wrap">


<!-- HEADER -->

<div class="glass header">

  <div class="eyebrow">

    CYBER ATTENDANCE

  </div>

  <h1>

    QR SCANNER

  </h1>

  <span class="online">

    ● ONLINE

  </span>

</div>


<!-- CAMERA -->

<div class="glass scanner">

  <div id="reader"></div>

</div>


<!-- CAMERA SELECT -->

<div class="controls">

  <select id="cameras">

    <option>
      Memuat kamera...
    </option>

  </select>


  <button id="restart">

    SCAN ULANG

  </button>

</div>


<!-- INFO -->

<div class="glass info">

  <b id="status">

    Menyiapkan kamera...

  </b>

  <p>

    Arahkan QR siswa ke kamera.
    Setelah QR terbaca, ID siswa
    langsung dikirim ke aplikasi
    absensi.

  </p>

</div>


<!-- RESULT -->

<div
  id="result"
  class="glass result">

  Menunggu QR...

</div>


</div>


<script>

let scanner = null;

let cameras = [];

let lastQR = '';

let lastTime = 0;

let targetOrigin = null;


const params =
  new URLSearchParams(
    location.search
  );


const returnOrigin =
  params.get(
    'returnOrigin'
  );


try{

  targetOrigin =
    returnOrigin
      ? new URL(
          returnOrigin
        ).origin
      : null;

}catch(error){

  targetOrigin = null;

}


function $(id){

  return document.getElementById(
    id
  );

}


// ================= KAMERA =================

async function loadCameras(){

  cameras =
    await Html5Qrcode
      .getCameras();


  if(!cameras.length){

    throw new Error(
      'Kamera tidak ditemukan.'
    );

  }


  $('cameras').innerHTML =
    cameras
      .map(
        (camera,index) => `

        <option
          value="${camera.id}">

          ${
            camera.label ||
            'Kamera ' +
            (index + 1)
          }

        </option>

      `
      )
      .join('');


  const backCamera =
    cameras.find(
      camera =>
        /back|rear|environment|belakang/i
          .test(
            camera.label
          )
    );


  if(backCamera){

    $('cameras').value =
      backCamera.id;

  }

}


// ================= START =================

async function startScanner(){

  if(!targetOrigin){

    $('status')
      .textContent =
      'Scanner belum terhubung.';

    $('result')
      .textContent =
      'Buka scanner dari aplikasi absensi.';

    return;

  }


  if(scanner){

    try{

      await scanner.stop();

    }catch(error){}

  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  $('status')
    .textContent =
    'Kamera aktif — arahkan ke QR';


  await scanner.start(

    $('cameras').value,

    {

      fps:20,

      qrbox:
        (width,height) => {

          const size =
            Math.min(
              width,
              height
            ) * .62;

          return {

            width:size,

            height:size

          };

        },

      aspectRatio:1

    },

    onScanSuccess,

    () => {}

  );

}


// ================= QR TERBACA =================

function onScanSuccess(decodedText){

  const value =
    String(
      decodedText || ''
    )
    .trim()
    .toUpperCase();


  if(!value){

    return;

  }


  const now =
    Date.now();


  if(
    value === lastQR &&
    now - lastTime < 2500
  ){

    return;

  }


  lastQR =
    value;

  lastTime =
    now;


  $('status')
    .textContent =
    'QR terbaca ✓';


  $('result')
    .textContent =
    'Mengirim ' +
    value +
    ' ...';


  if(
    window.opener &&
    targetOrigin
  ){

    window.opener.postMessage(

      {

        type:
          'QR_ATTENDANCE',

        value:
          value

      },

      targetOrigin

    );

  }else{

    $('result')
      .textContent =
      'Aplikasi utama tidak ditemukan.';

  }

}


// ================= TOMBOL ULANG =================

$('restart')
  .onclick =
    async () => {

      try{

        await startScanner();

      }catch(error){

        $('status')
          .textContent =
          'Kamera gagal dibuka';

        $('result')
          .textContent =
          'Izinkan akses kamera lalu coba lagi.';

      }

    };


$('cameras')
  .onchange =
    async () => {

      try{

        await startScanner();

      }catch(error){

        $('status')
          .textContent =
          'Kamera gagal dibuka';

      }

    };


// ================= START OTOMATIS =================

window.addEventListener(
  'load',
  async () => {

    if(!window.opener){

      $('status')
        .textContent =
        'Scanner harus dibuka dari aplikasi.';

      $('result')
        .textContent =
        'Buka menu Scan QR dari aplikasi absensi.';

      return;

    }


    try{

      await loadCameras();

      await startScanner();

    }catch(error){

      console.error(error);

      $('status')
        .textContent =
        'Kamera tidak dapat dibuka';

      $('result')
        .textContent =
        'Izinkan kamera browser lalu tekan SCAN ULANG.';

    }

  }
);

</script>

</body>

</html>
