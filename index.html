<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Scanner QR Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0;
    }

    .status {
      text-align: center;
      background: #1f2937;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    select,
    button {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 0;
      font-size: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #dc2626;
    }

    #reader {
      width: 100%;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    .result {
      background: #16a34a;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-top: 15px;
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 SCANNER QR</h1>

  <div
    id="status"
    class="status">
    Menyiapkan kamera...
  </div>


  <select id="cameraSelect">

    <option value="">
      Memuat kamera...
    </option>

  </select>


  <button
    onclick="startScanner()">
    ▶️ MULAI SCAN
  </button>


  <button
    class="stop"
    onclick="stopScanner()">
    ⏹ STOP
  </button>


  <div id="reader"></div>


  <div
    id="result"
    class="result">
  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const returnOrigin =
  params.get(
    'returnOrigin'
  ) || '*';

let scanner = null;
let cameras = [];
let lastValue = '';
let lastTime = 0;


/* =========================================================
   STATUS
========================================================= */

function setStatus(message) {

  document.getElementById(
    'status'
  ).textContent = message;
}


/* =========================================================
   LOAD CAMERA
========================================================= */

async function loadCameras() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      setStatus(
        'Browser tidak mendukung akses kamera.'
      );

      return;
    }

    /*
      Minta izin kamera terlebih dahulu.
    */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true
        });

    stream
      .getTracks()
      .forEach(function(track) {
        track.stop();
      });

    cameras =
      await Html5Qrcode.getCameras();

    const select =
      document.getElementById(
        'cameraSelect'
      );

    select.innerHTML = '';

    if (
      !cameras ||
      cameras.length === 0
    ) {

      select.innerHTML =
        '<option>Tidak ada kamera</option>';

      setStatus(
        'Kamera tidak ditemukan.'
      );

      return;
    }

    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        option.textContent =
          camera.label ||
          'Kamera ' +
          (index + 1);

        select.appendChild(option);
      }
    );


    /*
      Prioritaskan kamera belakang.
    */

    const backCamera =
      cameras.find(function(camera) {

        const label =
          String(
            camera.label || ''
          ).toLowerCase();

        return (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment') ||
          label.includes('belakang')
        );
      });

    if (backCamera) {
      select.value =
        backCamera.id;
    }

    setStatus(
      'Kamera siap. Pilih kamera lalu mulai scan.'
    );

  } catch (error) {

    console.error(error);

    setStatus(
      'Izin kamera ditolak atau kamera tidak dapat digunakan.'
    );
  }
}


/* =========================================================
   START
========================================================= */

async function startScanner() {

  if (scanner) {
    await stopScanner();
  }

  const cameraId =
    document.getElementById(
      'cameraSelect'
    ).value;

  if (!cameraId) {

    setStatus(
      'Pilih kamera terlebih dahulu.'
    );

    return;
  }

  scanner =
    new Html5Qrcode(
      'reader'
    );

  setStatus(
    'Membuka kamera...'
  );

  try {

    await scanner.start(

      cameraId,

      {
        fps: 15,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.70
              );

            return {
              width: size,
              height: size
            };
          },

        aspectRatio: 1.0,

        disableFlip: false
      },

      function(decodedText) {

        handleScan(
          decodedText
        );

      },

      function(errorMessage) {
        // scan belum berhasil
      }
    );

    setStatus(
      'Arahkan kamera ke QR siswa.'
    );

  } catch (error) {

    console.error(error);

    setStatus(
      'Kamera gagal dibuka. Pastikan izin kamera diberikan.'
    );
  }
}


/* =========================================================
   HASIL SCAN
========================================================= */

function handleScan(value) {

  value =
    String(value || '').trim();

  if (!value) return;

  const now =
    Date.now();

  if (
    value === lastValue &&
    now - lastTime < 2500
  ) {
    return;
  }

  lastValue = value;
  lastTime = now;


  const result =
    document.getElementById(
      'result'
    );

  result.style.display =
    'block';

  result.textContent =
    '✓ QR TERBACA: ' +
    value;


  /*
    Kirim hasil ke aplikasi Apps Script.
  */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          'QR_ATTENDANCE',

        value:
          value
      },

      returnOrigin
    );

    setStatus(
      'QR berhasil dibaca. Silakan scan siswa berikutnya.'
    );
  }
  else {

    setStatus(
      'Aplikasi utama tidak ditemukan.'
    );
  }
}


/* =========================================================
   STOP
========================================================= */

async function stopScanner() {

  if (!scanner) {
    return;
  }

  try {

    await scanner.stop();

  } catch (e) {

    console.log(e);

  }

  try {

    scanner.clear();

  } catch (e) {

    console.log(e);

  }

  scanner = null;

  setStatus(
    'Scanner dihentikan.'
  );
}


/* =========================================================
   LOAD
========================================================= */

window.addEventListener(
  'load',
  function() {

    loadCameras();

  }
);

</script>

</body>
</html>
