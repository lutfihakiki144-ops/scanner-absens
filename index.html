<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Scanner QR Absensi</title>


  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .scanner-box {
      width: 100%;
      max-width: 460px;
      background: white;
      color: #111827;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #0f766e;
    }

    #reader {
      width: 100%;
      margin: auto;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 10px;
    }

    .close-button {
      margin-top: 15px;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

  </style>

</head>


<body>


<div class="scanner-box">

  <h1>
    📷 SCANNER QR
  </h1>

  <p>
    Arahkan kamera ke QR siswa
  </p>


  <div id="reader"></div>


  <div
    id="status"
    class="status">

    Meminta izin kamera...

  </div>


  <button
    class="close-button"
    onclick="closeScanner()">

    Tutup Scanner

  </button>

</div>



<script>

let scanner = null;

let scanned = false;

let returnOrigin = '*';


/* URL APLIKASI APPS SCRIPT */

const params =
  new URLSearchParams(
    window.location.search
  );


if (
  params.get(
    'returnOrigin'
  )
) {

  returnOrigin =
    params.get(
      'returnOrigin'
    );

}


/* STATUS */

function setStatus(text) {

  document
    .getElementById(
      'status'
    )
    .textContent =
    text;

}


/* START */

async function startScanner() {

  try {

    setStatus(
      'Meminta izin kamera...'
    );


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    /*
     * MINTA IZIN KAMERA
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true
        });


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    setStatus(
      'Mencari kamera...'
    );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      !cameras.length
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    /*
     * CARI KAMERA BELAKANG
     */

    let cameraId =
      cameras[0].id;


    const backCamera =
      cameras.find(
        function(camera) {

          return /back|rear|environment/i
            .test(
              camera.label
            );

        }
      );


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      cameraId,

      {

        fps: 15,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.min(
                width,
                height
              ) * 0.7;


            return {

              width: size,

              height: size

            };

          },

        aspectRatio: 1

      },


      function(decodedText) {

        if (scanned) {
          return;
        }


        if (!decodedText) {
          return;
        }


        scanned = true;


        setStatus(
          'QR berhasil dibaca...'
        );


        sendResult(
          decodedText
        );

      },


      function() {

        /*
         * Error scanning sementara
         * tidak perlu ditampilkan.
         */

      }

    );


    setStatus(
      'Kamera aktif. Arahkan ke QR siswa.'
    );

  }

  catch (error) {

    console.error(error);


    setStatus(
      'Kamera gagal dibuka: ' +
      error.message
    );

  }

}


/* KIRIM KE APPS SCRIPT */

async function sendResult(value) {

  try {

    if (scanner) {

      await scanner.stop();

      await scanner.clear();

    }

  }

  catch (error) {

    console.log(error);

  }


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          'QR_ATTENDANCE',

        value:
          String(value).trim()
      },

      returnOrigin

    );


    setStatus(
      'QR berhasil dikirim.'
    );


    setTimeout(
      function() {

        window.close();

      },
      700
    );

  }

  else {

    setStatus(
      'Aplikasi absensi tidak ditemukan.'
    );

    scanned = false;

  }

}


/* TUTUP */

async function closeScanner() {

  try {

    if (scanner) {

      await scanner.stop();

      await scanner.clear();

    }

  }

  catch (error) {

    console.log(error);

  }


  window.close();

}


/* MULAI */

startScanner();

</script>

</body>

</html>
