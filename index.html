<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Scanner QR Absensi</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e3a8a
        );
      color: white;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 13px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: black;
    }

    .status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.1);
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #166534;
    }

    .error {
      background: #991b1b;
    }

    .button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: #1e3a8a;
      font-weight: 800;
      font-size: 15px;
    }

    .camera-list {
      margin-top: 15px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 0;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    📷 SCANNER QR ABSENSI
  </h1>

  <div class="subtitle">
    Arahkan kamera ke QR Code siswa
  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status">
    Meminta izin kamera...
  </div>


  <div
    id="cameraBox"
    class="camera-list"
    style="display:none;">

    <select
      id="cameraSelect"
      onchange="changeCamera()">
    </select>

  </div>


  <button
    class="button"
    onclick="window.close()">
    ✕ TUTUP SCANNER
  </button>

</div>


<script>

let html5QrCode = null;

let cameras = [];

let currentCameraId = null;

let scanning = false;

let lastScan = '';

let lastScanTime = 0;


const params =
  new URLSearchParams(
    window.location.search
  );


const returnOrigin =
  params.get('returnOrigin');


const statusElement =
  document.getElementById(
    'status'
  );


function setStatus(
  message,
  type = ''
) {

  statusElement.textContent =
    message;

  statusElement.className =
    'status ' + type;

}


/* =====================================================
   KIRIM HASIL KE APPS SCRIPT
===================================================== */

function sendResult(value) {

  if (!window.opener) {

    setStatus(
      'Jendela aplikasi utama tidak ditemukan.',
      'error'
    );

    return;
  }


  if (!returnOrigin) {

    setStatus(
      'returnOrigin tidak ditemukan.',
      'error'
    );

    return;
  }


  try {

    window.opener.postMessage(

      {
        type: 'QR_ATTENDANCE',
        value: String(value).trim()
      },

      returnOrigin

    );

  } catch (error) {

    setStatus(
      'Gagal mengirim hasil scan.',
      'error'
    );

    return;
  }

}


/* =====================================================
   HASIL QR
===================================================== */

function onScanSuccess(
  decodedText
) {

  const value =
    String(decodedText || '').trim();


  if (!value) {
    return;
  }


  const now =
    Date.now();


  /* cegah scan ganda cepat */

  if (
    value === lastScan &&
    now - lastScanTime < 2500
  ) {
    return;
  }


  lastScan =
    value;

  lastScanTime =
    now;


  setStatus(
    '✓ QR terbaca: ' +
    value +
    ' — mengirim...',
    'success'
  );


  sendResult(value);


  stopScanner();

}


function onScanFailure() {
  /* Tidak perlu menampilkan error
     setiap frame kamera */
}


/* =====================================================
   START CAMERA
===================================================== */

async function startScanner(
  cameraId
) {

  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode(
          'reader'
        );

    }


    currentCameraId =
      cameraId;


    await html5QrCode.start(

      cameraId,

      {
        fps: 15,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    );


    scanning = true;


    setStatus(
      'Kamera aktif. Arahkan ke QR siswa.'
    );

  } catch (error) {

    console.error(error);

    setStatus(
      'Tidak dapat membuka kamera. Pastikan izin kamera diberikan.',
      'error'
    );

  }

}


/* =====================================================
   STOP CAMERA
===================================================== */

async function stopScanner() {

  if (
    html5QrCode &&
    scanning
  ) {

    try {

      await html5QrCode.stop();

    } catch (error) {

      console.log(error);

    }

    scanning = false;

  }

}


/* =====================================================
   PILIH KAMERA
===================================================== */

async function changeCamera() {

  const select =
    document.getElementById(
      'cameraSelect'
    );


  const id =
    select.value;


  if (!id) {
    return;
  }


  await stopScanner();

  await startScanner(id);

}


/* =====================================================
   LOAD CAMERA
===================================================== */

async function loadCameras() {

  try {

    /* Meminta permission kamera */

    try {

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            video: true
          });


      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    } catch (permissionError) {

      setStatus(
        'Izin kamera ditolak. Izinkan kamera di browser.',
        'error'
      );

      return;

    }


    cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      !cameras.length
    ) {

      setStatus(
        'Kamera tidak ditemukan.',
        'error'
      );

      return;
    }


    const select =
      document.getElementById(
        'cameraSelect'
      );


    select.innerHTML =
      '';


    cameras.forEach(
      (camera, index) => {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        option.textContent =
          camera.label ||
          'Kamera ' +
          (index + 1);

        select.appendChild(
          option
        );

      }
    );


    document.getElementById(
      'cameraBox'
    ).style.display =
      cameras.length > 1
        ? 'block'
        : 'none';


    /* ==========================================
       Cari kamera belakang terlebih dahulu
    ========================================== */

    let selected =
      cameras[0].id;


    const rearCamera =
      cameras.find(camera => {

        const label =
          String(
            camera.label || ''
          ).toLowerCase();

        return (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment') ||
          label.includes('belakang')
        );

      });


    if (rearCamera) {

      selected =
        rearCamera.id;

    }


    select.value =
      selected;


    await startScanner(
      selected
    );


  } catch (error) {

    console.error(error);

    setStatus(
      'Gagal mengakses kamera.',
      'error'
    );

  }

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  'load',
  function() {

    loadCameras();

  }
);


/* =====================================================
   SAAT TAB DITUTUP
===================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    stopScanner();

  }
);

</script>

</body>
</html>
