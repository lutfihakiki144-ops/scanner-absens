<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>QR SCANNER - ABSENSI</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --green: #16a36a;
      --green-dark: #087b4b;
      --text: #17231e;
      --muted: #6b7a73;
      --danger: #d44744;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(60, 205, 145, .30),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(80, 170, 255, .20),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #f6fbf8,
          #e4f1ea
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 15px;
    }

    .app {
      width: min(500px, 100%);

      padding: 18px;

      border-radius: 32px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.78),
          rgba(255,255,255,.42)
        );

      border:
        1px solid rgba(255,255,255,.9);

      box-shadow:
        0 25px 70px rgba(40,80,65,.15);

      backdrop-filter:
        blur(30px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(30px)
        saturate(150%);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      background: rgba(22,163,106,.13);

      color: var(--green);

      font-size: 24px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
    }

    .subtitle {
      margin: 3px 0 0;

      color: var(--muted);

      font-size: 9px;
    }

    .status {
      padding: 7px 10px;

      border-radius: 999px;

      background: rgba(22,163,106,.10);

      color: var(--green-dark);

      font-size: 8px;
      font-weight: 800;

      white-space: nowrap;
    }

    #reader {
      width: 100%;

      overflow: hidden;

      border-radius: 25px;

      background: #111;

      border: 4px solid rgba(255,255,255,.85);

      min-height: 280px;
    }

    #reader video {
      width: 100% !important;
      max-width: 100% !important;

      border-radius: 20px;

      object-fit: cover;
    }

    #reader__scan_region {
      border-radius: 20px !important;
      overflow: hidden;
    }

    #reader__dashboard {
      display: none !important;
    }

    .result {
      margin-top: 13px;

      min-height: 64px;

      padding: 14px;

      border-radius: 18px;

      background: rgba(255,255,255,.48);

      border:
        1px solid rgba(255,255,255,.8);

      text-align: center;
    }

    .result strong {
      display: block;

      font-size: 11px;
    }

    .result span {
      display: block;

      margin-top: 5px;

      color: var(--green-dark);

      font-size: 16px;

      font-weight: 900;
    }

    .camera-row {
      display: grid;

      grid-template-columns: 1fr;

      gap: 9px;

      margin-top: 12px;
    }

    select,
    button {
      width: 100%;

      min-height: 45px;

      border:
        1px solid rgba(255,255,255,.85);

      border-radius: 15px;

      background: rgba(255,255,255,.58);

      color: var(--text);

      font: inherit;

      font-size: 10px;

      font-weight: 700;

      padding: 0 13px;

      outline: none;
    }

    select {
      cursor: pointer;
    }

    button {
      background:
        linear-gradient(
          145deg,
          #22b878,
          #0b9159
        );

      color: white;

      cursor: pointer;

      touch-action: manipulation;

      user-select: none;

      -webkit-user-select: none;
    }

    button:active {
      transform: scale(.98);
    }

    .help {
      text-align: center;

      margin: 12px 0 0;

      color: var(--muted);

      font-size: 9px;

      line-height: 1.5;
    }

    .success {
      color: var(--green-dark) !important;
    }

    .error {
      color: var(--danger) !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
        align-items: flex-start;
      }

      .app {
        margin-top: 8px;
        padding: 14px;
        border-radius: 28px;
      }

      #reader {
        min-height: 300px;
      }

      .top {
        margin-bottom: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="top">

      <div class="brand">

        <div class="icon">
          ▣
        </div>

        <div>

          <h1>
            QR SCANNER
          </h1>

          <p class="subtitle">
            ABSENSI SISWA
          </p>

        </div>

      </div>

      <div
        id="cameraStatus"
        class="status"
      >
        MEMUAT
      </div>

    </div>

    <div id="reader"></div>

    <div class="result">

      <strong id="resultTitle">
        Mengaktifkan kamera...
      </strong>

      <span id="resultText">
        Mohon izinkan akses kamera
      </span>

    </div>

    <div class="camera-row">

      <select id="cameraSelect">
        <option value="">
          Mencari kamera...
        </option>
      </select>

      <button
        type="button"
        id="switchCameraBtn"
      >
        ↻ GANTI KAMERA
      </button>

    </div>

    <p class="help">
      Kamera aktif otomatis.
      Pilih kamera dari daftar atau tekan
      GANTI KAMERA untuk berpindah kamera.
    </p>

  </main>


  <script>

    /* =====================================================
       KONFIGURASI
       ===================================================== */

    let scanner = null;

    let cameras = [];

    let currentCameraIndex = 0;

    let sent = false;

    let starting = false;

    const params =
      new URLSearchParams(
        window.location.search
      );

    const returnOrigin =
      params.get('returnOrigin') || '*';


    /* =====================================================
       ELEMENT
       ===================================================== */

    const cameraStatus =
      document.getElementById(
        'cameraStatus'
      );

    const resultTitle =
      document.getElementById(
        'resultTitle'
      );

    const resultText =
      document.getElementById(
        'resultText'
      );

    const cameraSelect =
      document.getElementById(
        'cameraSelect'
      );

    const switchCameraBtn =
      document.getElementById(
        'switchCameraBtn'
      );


    /* =====================================================
       STATUS
       ===================================================== */

    function setStatus(
      title,
      text,
      type = 'normal'
    ) {

      resultTitle.textContent =
        title;

      resultText.textContent =
        text;

      resultText.className =
        type === 'error'
          ? 'error'
          : type === 'success'
            ? 'success'
            : '';

    }


    /* =====================================================
       DETEKSI PERANGKAT
       ===================================================== */

    function isMobile() {

      return /Android|iPhone|iPad|iPod/i
        .test(
          navigator.userAgent
        );

    }


    /* =====================================================
       BERHENTIKAN SCANNER
       ===================================================== */

    async function stopScanner() {

      if (!scanner) {
        return;
      }

      try {
        await scanner.stop();
      } catch (error) {
        console.log(
          'Stop scanner:',
          error
        );
      }

      try {
        await scanner.clear();
      } catch (error) {
        console.log(
          'Clear scanner:',
          error
        );
      }

      scanner = null;

    }


    /* =====================================================
       CARI KAMERA
       ===================================================== */

    async function getCameras() {

      try {

        setStatus(
          'Mencari kamera',
          'Memeriksa kamera perangkat...'
        );

        /*
         * Meminta izin kamera terlebih dahulu.
         *
         * Ini penting pada beberapa HP karena
         * label kamera sering masih kosong sebelum
         * permission diberikan.
         */

        let permissionStream = null;

        try {

          permissionStream =
            await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });

        } catch (permissionError) {

          console.error(
            'Permission kamera:',
            permissionError
          );

          throw new Error(
            'Akses kamera ditolak. Tekan Izinkan/Allow pada browser.'
          );

        } finally {

          if (permissionStream) {

            permissionStream
              .getTracks()
              .forEach(
                track => track.stop()
              );

          }

        }


        /*
         * Setelah permission diberikan,
         * ambil daftar kamera.
         */

        cameras =
          await Html5Qrcode.getCameras();


        if (!cameras || !cameras.length) {

          throw new Error(
            'Kamera tidak ditemukan pada perangkat.'
          );

        }


        console.log(
          'Daftar kamera:',
          cameras
        );


        cameraSelect.innerHTML = '';


        cameras.forEach(
          (camera, index) => {

            const option =
              document.createElement(
                'option'
              );

            option.value =
              String(index);

            let label =
              camera.label ||
              `Kamera ${index + 1}`;

            /*
             * Beri nama yang lebih mudah
             * dibaca pengguna.
             */

            if (
              /front|user|facetime|selfie/i
                .test(label)
            ) {

              label =
                '🤳 Kamera Depan';

            } else if (
              /back|rear|environment|world/i
                .test(label)
            ) {

              label =
                '📷 Kamera Belakang';

            } else {

              label =
                `📷 ${label}`;

            }

            option.textContent =
              label;

            cameraSelect.appendChild(
              option
            );

          }
        );


        /*
         * Prioritaskan kamera belakang.
         */

        let preferred =
          cameras.findIndex(
            camera =>
              /back|rear|environment|world/i
                .test(
                  camera.label || ''
                )
          );


        /*
         * Jika kamera belakang tidak
         * terdeteksi, gunakan kamera pertama.
         */

        if (preferred < 0) {

          preferred = 0;

        }


        currentCameraIndex =
          preferred;

        cameraSelect.value =
          String(preferred);


        await startCamera(
          preferred
        );

      } catch (error) {

        console.error(
          'getCameras:',
          error
        );

        cameraStatus.textContent =
          'ERROR';

        setStatus(
          'Kamera tidak dapat dibuka',
          error.message ||
          'Izinkan akses kamera pada browser.',
          'error'
        );

      }

    }


    /* =====================================================
       MULAI KAMERA
       ===================================================== */

    async function startCamera(
      index
    ) {

      if (starting) {
        return;
      }

      if (!cameras[index]) {

        setStatus(
          'Kamera tidak ditemukan',
          'Silakan pilih kamera lain.',
          'error'
        );

        return;

      }


      starting = true;

      sent = false;


      try {

        await stopScanner();


        scanner =
          new Html5Qrcode(
            'reader'
          );


        const cameraId =
          cameras[index].id;


        cameraStatus.textContent =
          'MEMBUKA';


        setStatus(
          'Membuka kamera',
          'Mohon tunggu...'
        );


        /*
         * Gunakan ID kamera secara langsung.
         *
         * Ini lebih stabil untuk perpindahan
         * kamera depan / belakang dibanding
         * memaksa facingMode exact.
         */

        await scanner.start(
          cameraId,
          {
            fps: 15,

            qrbox:
              function(
                viewfinderWidth,
                viewfinderHeight
              ) {

                const size =
                  Math.floor(
                    Math.min(
                      viewfinderWidth,
                      viewfinderHeight
                    ) * 0.70
                  );

                return {
                  width:
                    Math.max(
                      180,
                      size
                    ),

                  height:
                    Math.max(
                      180,
                      size
                    )
                };

              },

            aspectRatio: 1.0,

            disableFlip: false

          },

          onScanSuccess,

          function() {}

        );


        currentCameraIndex =
          index;

        cameraSelect.value =
          String(index);


        cameraStatus.textContent =
          'AKTIF';


        const selectedCamera =
          cameras[index];

        const cameraName =
          selectedCamera.label ||
          `Kamera ${index + 1}`;


        setStatus(
          'Scanner aktif',
          cameraName
        );


      } catch (error) {

        console.error(
          'startCamera:',
          error
        );


        cameraStatus.textContent =
          'ERROR';


        setStatus(
          'Kamera gagal',
          error.message ||
          'Kamera tidak dapat digunakan.',
          'error'
        );


        /*
         * Jika kamera yang dipilih gagal,
         * coba kamera berikutnya secara otomatis.
         */

        if (cameras.length > 1) {

          const nextIndex =
            (
              index + 1
            ) %
            cameras.length;


          if (
            nextIndex !== index
          ) {

            setTimeout(
              () => {

                startCamera(
                  nextIndex
                );

              },
              500
            );

          }

        }

      } finally {

        starting = false;

      }

    }


    /* =====================================================
       QR BERHASIL TERBACA
       ===================================================== */

    async function onScanSuccess(
      decodedText
    ) {

      if (sent) {
        return;
      }


      const code =
        String(
          decodedText || ''
        ).trim();


      if (!code) {
        return;
      }


      sent = true;


      setStatus(
        'QR TERDETEKSI',
        code,
        'success'
      );


      try {

        await stopScanner();

      } catch (error) {

        console.log(
          error
        );

      }


      /*
       * Kirim ID siswa ke aplikasi
       * Google Apps Script.
       */

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'QR_ATTENDANCE',

            studentId:
              code
          },

          returnOrigin
        );


        setStatus(
          'SCAN BERHASIL',
          'Absensi sedang disimpan...',
          'success'
        );


        setTimeout(
          () => {

            try {

              window.close();

            } catch (error) {}

          },
          900
        );


      } else {

        setStatus(
          'Scanner berdiri sendiri',
          'Buka scanner melalui aplikasi absensi.',
          'error'
        );

      }

    }


    /* =====================================================
       PILIH KAMERA
       ===================================================== */

    cameraSelect.addEventListener(
      'change',
      async function() {

        const index =
          Number(
            this.value
          );


        if (
          Number.isNaN(index)
        ) {
          return;
        }


        currentCameraIndex =
          index;


        await startCamera(
          index
        );

      }
    );


    /* =====================================================
       GANTI KAMERA
       ===================================================== */

    switchCameraBtn.addEventListener(
      'click',
      async function() {

        if (
          cameras.length < 2
        ) {

          setStatus(
            'Kamera tidak tersedia',
            'Perangkat hanya menyediakan satu kamera.',
            'error'
          );

          return;

        }


        currentCameraIndex =
          (
            currentCameraIndex + 1
          ) %
          cameras.length;


        cameraSelect.value =
          String(
            currentCameraIndex
          );


        await startCamera(
          currentCameraIndex
        );

      }
    );


    /* =====================================================
       INISIALISASI
       ===================================================== */

    async function initScanner() {

      try {

        cameraStatus.textContent =
          'MEMUAT';


        setStatus(
          'Mengaktifkan kamera',
          'Mohon izinkan akses kamera...'
        );


        /*
         * JANGAN lagi menggunakan:
         *
         * facingMode:
         * {
         *   exact: 'environment'
         * }
         *
         * karena dapat membuat kamera depan
         * tidak bisa dipilih pada beberapa HP.
         *
         * Kita langsung minta permission lalu
         * mengambil daftar kamera.
         */

        await getCameras();

      } catch (error) {

        console.error(
          'initScanner:',
          error
        );


        cameraStatus.textContent =
          'ERROR';


        setStatus(
          'Scanner gagal',
          error.message ||
          'Tidak dapat mengakses kamera.',
          'error'
        );

      }

    }


    /* =====================================================
       JALANKAN
       ===================================================== */

    window.addEventListener(
      'load',
      function() {

        initScanner();

      }
    );

  </script>

</body>
</html>
