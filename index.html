<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Scanner QR Absensi</title>

<script
src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 15px;

  background: #101010;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}

.container {

  width: 100%;

  max-width: 500px;

  margin: auto;

}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

#reader {

  width: 100%;

  background: white;

  border-radius: 15px;

  overflow: hidden;

  min-height: 300px;

}

select,
button {

  width: 100%;

  padding: 14px;

  margin-top: 10px;

  border-radius: 10px;

  font-size: 16px;

}

select {

  background: #222;

  color: white;

  border: 1px solid #444;

}

button {

  border: none;

  background: #ffd400;

  color: #111;

  font-weight: bold;

}

.stop {

  background: #d83232;

  color: white;

}

#status {

  margin-top: 15px;

  padding: 13px;

  background: #222;

  border-radius: 10px;

  min-height: 45px;

}

.success {
  background: #164e2d !important;
}

.error {
  background: #601818 !important;
}

.info {

  color: #aaa;

  margin-top: 15px;

  font-size: 13px;

}

</style>

</head>

<body>


<div class="container">

  <h1>
    📷 SCANNER QR
  </h1>

  <div class="subtitle">
    Scanner QR Absensi Siswa
  </div>


  <select id="cameraSelect">

    <option value="">
      Memuat kamera...
    </option>

  </select>


  <div id="reader"></div>


  <button
    onclick="startScanner()">

    📷 MULAI KAMERA

  </button>


  <button
    class="stop"
    onclick="stopScanner()">

    ⛔ STOP KAMERA

  </button>


  <div id="status">

    Menyiapkan scanner...

  </div>


  <div class="info">

    Arahkan QR siswa ke dalam kotak scanner.

  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );


const returnOrigin =
  params.get(
    'returnOrigin'
  ) || '*';


let scanner = null;

let running = false;

let lastScan = '';

let lastScanTime = 0;


/* =========================================
   STATUS
========================================= */

function setStatus(
  message,
  type = ''
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    message;


  status.className =
    type;

}


/* =========================================
   LOAD CAMERA
========================================= */

async function loadCameras() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ) {

      throw new Error(
        'Browser tidak mendukung kamera.'
      );

    }


    /*
     * Minta izin kamera.
     */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          video: true
        });


    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    const select =
      document.getElementById(
        'cameraSelect'
      );


    select.innerHTML =
      '';


    if (!cameras.length) {

      select.innerHTML =
        '<option>Tidak ada kamera</option>';


      setStatus(
        '❌ Kamera tidak ditemukan.',
        'error'
      );


      return;

    }


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.id;


        option.textContent =
          camera.label ||
          'Kamera ' +
          (index + 1);


        select.appendChild(
          option
        );

      }
    );


    /*
     * Prioritaskan kamera belakang.
     */

    const rear =
      cameras.find(
        function(camera) {

          return /back|rear|environment/i
            .test(
              camera.label
            );

        }
      );


    if (rear) {

      select.value =
        rear.id;

    }


    setStatus(
      '✅ Kamera siap. Tekan MULAI KAMERA.'
    );


  } catch (error) {

    console.error(error);


    setStatus(
      '❌ Kamera tidak dapat digunakan: ' +
      error.message,
      'error'
    );

  }

}


/* =========================================
   START SCANNER
========================================= */

async function startScanner() {

  if (running)
    return;


  try {

    const cameraId =
      document
        .getElementById(
          'cameraSelect'
        ).value;


    if (!cameraId) {

      setStatus(
        '❌ Pilih kamera terlebih dahulu.',
        'error'
      );


      return;

    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      cameraId,

      {

        fps: 15,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * .70
              );


            return {

              width:
                size,

              height:
                size

            };

          },

        aspectRatio:
          1.0,

        disableFlip:
          false

      },


      function(decodedText) {

        qrFound(
          decodedText
        );

      },


      function() {

        /*
         * Ignore scan frame errors.
         */

      }

    );


    running = true;


    setStatus(
      '📷 SCANNER AKTIF — arahkan kamera ke QR.'
    );


  } catch (error) {

    console.error(error);


    setStatus(
      '❌ Gagal membuka kamera: ' +
      error.message,
      'error'
    );

  }

}


/* =========================================
   QR FOUND
========================================= */

function qrFound(
  decodedText
) {

  const now =
    Date.now();


  /*
   * Jangan kirim QR yang sama
   * berulang kali.
   */

  if (
    decodedText === lastScan &&
    now -
      lastScanTime <
      2500
  ) {

    return;

  }


  lastScan =
    decodedText;


  lastScanTime =
    now;


  setStatus(
    '✅ QR TERBACA: ' +
    decodedText,
    'success'
  );


  /*
   * Kirim ke Apps Script.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {

        type:
          'QR_ATTENDANCE',

        value:
          decodedText

      },

      returnOrigin

    );

  }

}


/* =========================================
   STOP
========================================= */

async function stopScanner() {

  if (
    !scanner ||
    !running
  ) {

    return;

  }


  try {

    await scanner.stop();

    await scanner.clear();

  } catch (error) {

    console.error(error);

  }


  running =
    false;


  setStatus(
    'Kamera dihentikan.'
  );

}


/* =========================================
   LOAD
========================================= */

window.addEventListener(
  'load',
  loadCameras
);

</script>

</body>

</html>
