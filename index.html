<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#16a36a"
  >

  <title>QR SCANNER - ABSENSI</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      padding: 14px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: #17231e;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(60,205,145,.30),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(80,170,255,.20),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #f6fbf8,
          #e4f1ea
        );

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .app {

      width: min(520px,100%);

      padding: 16px;

      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.82),
          rgba(255,255,255,.46)
        );

      border:
        1px solid
        rgba(255,255,255,.9);

      box-shadow:
        0 25px 70px
        rgba(40,80,65,.16);

      backdrop-filter:
        blur(30px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(30px)
        saturate(150%);
    }

    .top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 14px;
    }

    .brand {

      display: flex;

      align-items: center;

      gap: 10px;
    }

    .logo {

      width: 44px;
      height: 44px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 15px;

      color: white;

      background:
        linear-gradient(
          145deg,
          #28c886,
          #087b4b
        );

      font-size: 22px;
    }

    h1 {

      margin: 0;

      font-size: 16px;

      font-weight: 900;
    }

    .sub {

      margin-top: 3px;

      color: #718078;

      font-size: 8px;

      font-weight: 800;

      letter-spacing: .7px;
    }

    .status {

      padding: 7px 10px;

      border-radius: 999px;

      background:
        rgba(22,163,106,.10);

      color: #087b4b;

      font-size: 8px;

      font-weight: 900;
    }

    .status.error {

      background:
        rgba(212,71,68,.10);

      color: #d44744;
    }

    .reader-wrap {

      position: relative;

      overflow: hidden;

      border-radius: 25px;

      border: 4px solid
        rgba(255,255,255,.9);

      background: #111;
    }

    #reader {

      width: 100%;

      min-height: 320px;

      overflow: hidden;
    }

    #reader video {

      width: 100% !important;

      height: auto !important;

      min-height: 320px;

      object-fit: cover;

      border-radius: 20px;
    }

    #reader__dashboard {

      display: none !important;
    }

    #reader__scan_region {

      min-height: 320px;
    }

    #reader__scan_region img {

      display: none !important;
    }

    .scan-frame {

      pointer-events: none;

      position: absolute;

      z-index: 5;

      width: 68%;

      aspect-ratio: 1;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%,-50%);

      border:
        2px solid
        rgba(255,255,255,.95);

      border-radius: 23px;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.16);
    }

    .result {

      margin-top: 12px;

      min-height: 70px;

      padding: 13px;

      border-radius: 18px;

      background:
        rgba(255,255,255,.52);

      border:
        1px solid
        rgba(255,255,255,.82);

      text-align: center;
    }

    .result strong {

      display: block;

      font-size: 11px;

      font-weight: 900;
    }

    .result span {

      display: block;

      margin-top: 5px;

      color: #087b4b;

      font-size: 15px;

      font-weight: 900;

      word-break: break-word;
    }

    .result span.error {

      color: #d44744;
    }

    .result span.success {

      color: #087b4b;
    }

    select,
    button {

      width: 100%;

      min-height: 45px;

      border-radius: 14px;

      border:
        1px solid
        rgba(255,255,255,.85);

      background:
        rgba(255,255,255,.62);

      color: #17231e;

      font-size: 10px;

      font-weight: 800;

      padding: 0 12px;
    }

    button {

      border: 0;

      color: white;

      background:
        linear-gradient(
          145deg,
          #22b878,
          #0b9159
        );

      cursor: pointer;
    }

    button.secondary {

      color: #087b4b;

      background:
        rgba(255,255,255,.65);

      border:
        1px solid
        rgba(22,163,106,.16);
    }

    .controls {

      display: grid;

      gap: 8px;

      margin-top: 11px;
    }

    .camera-buttons {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 8px;
    }

    .help {

      margin: 11px 0 0;

      color: #718078;

      text-align: center;

      font-size: 9px;

      line-height: 1.5;
    }

    @media (max-width: 480px) {

      body {

        align-items: flex-start;

        padding: 10px;
      }

      .app {

        margin-top: 5px;

        padding: 12px;

        border-radius: 26px;
      }

      #reader {

        min-height: 330px;
      }

      #reader video {

        min-height: 330px;
      }

      #reader__scan_region {

        min-height: 330px;
      }

      .scan-frame {

        width: 72%;
      }

    }

  </style>

</head>


<body>

  <main class="app">

    <div class="top">

      <div class="brand">

        <div class="logo">
          ▣
        </div>

        <div>

          <h1>
            QR SCANNER
          </h1>

          <div class="sub">
            ABSENSI SISWA
          </div>

        </div>

      </div>


      <div
        id="cameraStatus"
        class="status"
      >
        MEMUAT
      </div>

    </div>


    <div class="reader-wrap">

      <div id="reader"></div>

      <div class="scan-frame"></div>

    </div>


    <div class="result">

      <strong id="resultTitle">
        Menyiapkan kamera...
      </strong>

      <span id="resultText">
        Mohon tunggu.
      </span>

    </div>


    <div class="controls">

      <select id="cameraSelect">

        <option value="">
          Mencari kamera...
        </option>

      </select>


      <div class="camera-buttons">

        <button
          id="frontBtn"
          type="button"
          class="secondary"
        >
          🤳 KAMERA DEPAN
        </button>


        <button
          id="backBtn"
          type="button"
        >
          📷 KAMERA BELAKANG
        </button>

      </div>


      <button
        id="restartBtn"
        type="button"
        class="secondary"
      >
        ↻ MULAI ULANG
      </button>

    </div>


    <div class="help">
      Kamera otomatis aktif.
      Scanner mendukung kamera depan,
      kamera belakang, dan webcam komputer.
    </div>

  </main>


  <script>

    let scanner = null;

    let cameras = [];

    let currentIndex = 0;

    let currentMode =
      'environment';

    let sent = false;

    let processing = false;


    const params =
      new URLSearchParams(
        window.location.search
      );


    let returnOrigin =
      params.get(
        'returnOrigin'
      ) || '';


    /*
     * Pastikan returnOrigin adalah HTTPS.
     */

    try {

      if (returnOrigin) {

        const url =
          new URL(
            returnOrigin
          );

        if (
          url.protocol !==
          'https:'
        ) {

          returnOrigin = '';

        }

      }

    } catch (error) {

      returnOrigin = '';

    }


    const cameraStatus =
      document.getElementById(
        'cameraStatus'
      );

    const resultTitle =
      document.getElementById(
        'resultTitle'
      );

    const resultText =
      document.getElementById(
        'resultText'
      );

    const cameraSelect =
      document.getElementById(
        'cameraSelect'
      );

    const frontBtn =
      document.getElementById(
        'frontBtn'
      );

    const backBtn =
      document.getElementById(
        'backBtn'
      );

    const restartBtn =
      document.getElementById(
        'restartBtn'
      );


    function setStatus(
      title,
      text,
      type = ''
    ) {

      resultTitle.textContent =
        title;

      resultText.textContent =
        text;

      resultText.className =
        type;

    }


    function setCameraStatus(
      text,
      error = false
    ) {

      cameraStatus.textContent =
        text;

      cameraStatus.className =
        'status' +
        (
          error
            ? ' error'
            : ''
        );

    }


    async function stopScanner() {

      if (!scanner) {
        return;
      }

      try {

        await scanner.stop();

      } catch (error) {}

      try {

        await scanner.clear();

      } catch (error) {}

      scanner = null;

    }


    function findCamera(
      mode
    ) {

      if (!cameras.length) {
        return 0;
      }

      const labels =
        cameras.map(
          camera =>
            String(
              camera.label || ''
            ).toLowerCase()
        );


      if (mode === 'user') {

        const front =
          labels.findIndex(
            label =>
              /front|user|facetime|selfie/i
                .test(label)
          );

        if (front >= 0) {
          return front;
        }

        /*
         * Pada beberapa HP kamera depan
         * muncul sebagai kamera pertama.
         */

        return 0;

      }


      const back =
        labels.findIndex(
          label =>
            /back|rear|environment|world|main/i
              .test(label)
        );

      if (back >= 0) {
        return back;
      }

      /*
       * Jika label tidak tersedia,
       * kamera terakhir sering menjadi
       * kamera belakang pada HP.
       */

      return cameras.length > 1
        ? cameras.length - 1
        : 0;

    }


    function renderCameras() {

      cameraSelect.innerHTML =
        '';

      cameras.forEach(
        (camera, index) => {

          const option =
            document.createElement(
              'option'
            );

          option.value =
            index;

          option.textContent =
            camera.label ||
            `Kamera ${index + 1}`;

          cameraSelect.appendChild(
            option
          );

        }
      );

      cameraSelect.value =
        currentIndex;

    }


    async function getCameraList() {

      try {

        setCameraStatus(
          'IZIN KAMERA'
        );

        setStatus(
          'Meminta akses kamera',
          'Izinkan kamera pada browser.'
        );


        cameras =
          await Html5Qrcode
            .getCameras();


        if (
          !cameras.length
        ) {

          throw new Error(
            'Kamera tidak ditemukan.'
          );

        }


        currentIndex =
          findCamera(
            currentMode
          );


        renderCameras();


        await startCamera(
          currentIndex
        );

      } catch (error) {

        console.error(
          error
        );

        setCameraStatus(
          'ERROR',
          true
        );

        setStatus(
          'KAMERA GAGAL',
          getErrorMessage(error),
          'error'
        );

      }

    }


    function getErrorMessage(
      error
    ) {

      const message =
        String(
          error?.message ||
          error ||
          ''
        );

      if (
        /permission|denied|notallowed/i
          .test(message)
      ) {

        return (
          'Akses kamera ditolak. ' +
          'Izinkan kamera pada browser.'
        );

      }

      if (
        /notfound|device/i
          .test(message)
      ) {

        return (
          'Kamera tidak ditemukan.'
        );

      }

      return (
        message ||
        'Tidak dapat membuka kamera.'
      );

    }


    async function startCamera(
      index
    ) {

      if (
        !cameras[index]
      ) {
        return;
      }


      await stopScanner();


      sent = false;

      processing = false;


      currentIndex =
        index;


      cameraSelect.value =
        index;


      setCameraStatus(
        'MEMULAI'
      );

      setStatus(
        'MEMULAI SCANNER',
        cameras[index].label ||
        `Kamera ${index + 1}`
      );


      scanner =
        new Html5Qrcode(
          'reader'
        );


      try {

        await scanner.start(
          cameras[index].id,

          {
            fps: 15,

            qrbox: function(
              width,
              height
            ) {

              const size =
                Math.floor(
                  Math.min(
                    width,
                    height
                  ) * .70
                );

              return {
                width:
                  Math.max(
                    180,
                    size
                  ),

                height:
                  Math.max(
                    180,
                    size
                  )
              };

            },

            aspectRatio: 1,

            disableFlip: false
          },

          onScanSuccess,

          function() {}

        );


        setCameraStatus(
          'AKTIF'
        );

        setStatus(
          'SCANNER AKTIF',
          'Arahkan QR siswa ke kamera.'
        );

      } catch (error) {

        console.error(
          error
        );

        scanner = null;

        setCameraStatus(
          'ERROR',
          true
        );

        setStatus(
          'KAMERA GAGAL',
          getErrorMessage(error),
          'error'
        );

      }

    }


    async function onScanSuccess(
      decodedText
    ) {

      if (
        sent ||
        processing
      ) {
        return;
      }


      let code =
        String(
          decodedText || ''
        )
          .trim()
          .replace(
            /\s+/g,
            ''
          )
          .toUpperCase();


      if (!code) {
        return;
      }


      /*
       * QR harus berupa ID siswa.
       * Contoh:
       *
       * S001
       * S002
       * S100
       */

      if (
        !/^S\d+$/i.test(code)
      ) {

        setStatus(
          'QR TIDAK VALID',
          'QR harus berisi ID siswa seperti S001.',
          'error'
        );

        return;

      }


      sent = true;

      processing = true;


      setStatus(
        'QR TERDETEKSI',
        code,
        'success'
      );


      await stopScanner();


      /*
       * Pastikan scanner dibuka
       * dari aplikasi Apps Script.
       */

      if (
        !window.opener ||
        window.opener.closed
      ) {

        sent = false;

        processing = false;

        setCameraStatus(
          'ERROR',
          true
        );

        setStatus(
          'APLIKASI TIDAK DITEMUKAN',
          'Buka scanner melalui tombol SCAN QR aplikasi absensi.',
          'error'
        );

        return;

      }


      if (!returnOrigin) {

        sent = false;

        processing = false;

        setCameraStatus(
          'ERROR',
          true
        );

        setStatus(
          'RETURN ORIGIN ERROR',
          'Scanner tidak terhubung ke aplikasi utama.',
          'error'
        );

        return;

      }


      try {

        /*
         * INI BAGIAN SINKRONISASI
         * DENGAN JavaScript.html APPS SCRIPT.
         */

        window.opener.postMessage(
          {
            type:
              'QR_ATTENDANCE',

            studentId:
              code
          },

          returnOrigin
        );


        setCameraStatus(
          'TERKIRIM'
        );

        setStatus(
          'SCAN BERHASIL',
          `${code} sedang disimpan sebagai HADIR...`,
          'success'
        );


        setTimeout(
          function() {

            try {

              window.close();

            } catch (error) {}

          },
          900
        );

      } catch (error) {

        console.error(
          error
        );

        sent = false;

        processing = false;

        setCameraStatus(
          'ERROR',
          true
        );

        setStatus(
          'GAGAL MENGIRIM',
          'Silakan coba lagi.',
          'error'
        );

      }

    }


    cameraSelect.addEventListener(
      'change',
      async function() {

        if (processing) {
          return;
        }

        const index =
          Number(
            this.value
          );

        if (
          !Number.isInteger(index) ||
          !cameras[index]
        ) {
          return;
        }

        const label =
          String(
            cameras[index].label || ''
          );

        currentMode =
          /front|user|facetime|selfie/i
            .test(label)
            ? 'user'
            : 'environment';

        await startCamera(
          index
        );

      }
    );


    frontBtn.addEventListener(
      'click',
      async function() {

        if (processing) {
          return;
        }

        currentMode =
          'user';

        if (!cameras.length) {

          await getCameraList();

          return;

        }

        const index =
          findCamera(
            'user'
          );

        await startCamera(
          index
        );

      }
    );


    backBtn.addEventListener(
      'click',
      async function() {

        if (processing) {
          return;
        }

        currentMode =
          'environment';

        if (!cameras.length) {

          await getCameraList();

          return;

        }

        const index =
          findCamera(
            'environment'
          );

        await startCamera(
          index
        );

      }
    );


    restartBtn.addEventListener(
      'click',
      async function() {

        if (processing) {
          return;
        }

        sent = false;

        currentMode =
          'environment';

        await stopScanner();

        await getCameraList();

      }
    );


    /*
     * MULAI OTOMATIS
     */

    async function init() {

      if (
        typeof Html5Qrcode ===
        'undefined'
      ) {

        setCameraStatus(
          'ERROR',
          true
        );

        setStatus(
          'LIBRARY ERROR',
          'Library QR scanner tidak dapat dimuat.',
          'error'
        );

        return;

      }

      await getCameraList();

    }


    init();

  </script>

</body>

</html>
