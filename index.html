<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1,
    maximum-scale=1"
  >

  <title>QR SCANNER - ABSENSI</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    :root {
      --green: #16a36a;
      --green-dark: #087b4b;
      --text: #17231e;
      --muted: #6b7a73;
    }


    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(60,205,145,.30),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(80,170,255,.20),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #f6fbf8,
          #e4f1ea
        );

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        15px;
    }


    .app {

      width:
        min(500px,100%);

      padding:
        18px;

      border-radius:
        32px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.78),
          rgba(255,255,255,.42)
        );

      border:
        1px solid
        rgba(255,255,255,.9);

      box-shadow:
        0 25px 70px
        rgba(40,80,65,.15);

      backdrop-filter:
        blur(30px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(30px)
        saturate(150%);
    }


    .top {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        15px;
    }


    .brand {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;
    }


    .icon {

      width:
        44px;

      height:
        44px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        15px;

      background:
        rgba(22,163,106,.13);

      color:
        var(--green);

      font-size:
        24px;
    }


    h1 {

      margin:
        0;

      font-size:
        17px;
    }


    .subtitle {

      margin:
        3px 0 0;

      color:
        var(--muted);

      font-size:
        9px;
    }


    .status {

      padding:
        7px 10px;

      border-radius:
        999px;

      background:
        rgba(22,163,106,.10);

      color:
        var(--green-dark);

      font-size:
        8px;

      font-weight:
        800;
    }


    #reader {

      width:
        100%;

      overflow:
        hidden;

      border-radius:
        25px;

      background:
        #111;

      border:
        4px solid
        rgba(255,255,255,.85);
    }


    #reader video {

      border-radius:
        20px;
    }


    .result {

      margin-top:
        13px;

      min-height:
        64px;

      padding:
        14px;

      border-radius:
        18px;

      background:
        rgba(255,255,255,.48);

      border:
        1px solid
        rgba(255,255,255,.8);

      text-align:
        center;
    }


    .result strong {

      display:
        block;

      font-size:
        11px;
    }


    .result span {

      display:
        block;

      margin-top:
        5px;

      color:
        var(--green-dark);

      font-size:
        16px;

      font-weight:
        900;
    }


    .camera-row {

      display:
        grid;

      grid-template-columns:
        1fr;

      gap:
        9px;

      margin-top:
        12px;
    }


    select,
    button {

      width:
        100%;

      min-height:
        45px;

      border:
        1px solid
        rgba(255,255,255,.85);

      border-radius:
        15px;

      background:
        rgba(255,255,255,.58);

      color:
        var(--text);

      font:
        inherit;

      font-size:
        10px;

      font-weight:
        700;

      padding:
        0 13px;
    }


    button {

      background:
        linear-gradient(
          145deg,
          #22b878,
          #0b9159
        );

      color:
        white;

      cursor:
        pointer;
    }


    .help {

      text-align:
        center;

      margin:
        12px 0 0;

      color:
        var(--muted);

      font-size:
        9px;

      line-height:
        1.5;
    }


    .success {

      color:
        var(--green-dark) !important;
    }


    .error {

      color:
        #d44744 !important;
    }

  </style>

</head>


<body>

  <main class="app">

    <div class="top">

      <div class="brand">

        <div class="icon">
          ▣
        </div>

        <div>

          <h1>
            QR SCANNER
          </h1>

          <p class="subtitle">
            ABSENSI SISWA
          </p>

        </div>

      </div>

      <div
        id="cameraStatus"
        class="status"
      >
        CAMERA
      </div>

    </div>


    <div id="reader"></div>


    <div class="result">

      <strong id="resultTitle">
        Arahkan QR siswa ke kamera
      </strong>

      <span id="resultText">
        Menunggu QR...
      </span>

    </div>


    <div class="camera-row">

      <select id="cameraSelect">
        <option>
          Mencari kamera...
        </option>
      </select>

      <button
        type="button"
        id="switchCameraBtn"
      >
        ↻ GANTI KAMERA
      </button>

    </div>


    <p class="help">
      Kamera akan aktif otomatis.
      Scanner mendukung webcam komputer
      serta kamera depan/belakang HP.
    </p>

  </main>


  <script>

    let scanner = null;

    let cameras = [];

    let currentCameraIndex = 0;

    let sent = false;

    const params =
      new URLSearchParams(
        window.location.search
      );

    const returnOrigin =
      params.get(
        'returnOrigin'
      ) || '*';


    const cameraStatus =
      document.getElementById(
        'cameraStatus'
      );

    const resultTitle =
      document.getElementById(
        'resultTitle'
      );

    const resultText =
      document.getElementById(
        'resultText'
      );

    const cameraSelect =
      document.getElementById(
        'cameraSelect'
      );

    const switchCameraBtn =
      document.getElementById(
        'switchCameraBtn'
      );


    function setStatus(
      title,
      text,
      type = 'normal'
    ) {

      resultTitle.textContent =
        title;

      resultText.textContent =
        text;

      resultText.className =
        type === 'error'
          ? 'error'
          : type === 'success'
            ? 'success'
            : '';

    }


    async function getCameras() {

      try {

        cameras =
          await Html5Qrcode
            .getCameras();


        if (!cameras.length) {

          throw new Error(
            'Kamera tidak ditemukan.'
          );

        }


        cameraSelect.innerHTML =
          '';


        cameras.forEach(
          (camera, index) => {

            const option =
              document.createElement(
                'option'
              );

            option.value =
              index;

            option.textContent =
              camera.label ||
              `Kamera ${index + 1}`;

            cameraSelect.appendChild(
              option
            );

          }
        );


        /*
         * Prioritaskan kamera belakang
         * pada HP.
         */

        let preferred =
          cameras.findIndex(
            camera =>
              /back|rear|environment/i
                .test(
                  camera.label || ''
                )
          );


        if (preferred < 0) {
          preferred = 0;
        }


        currentCameraIndex =
          preferred;

        cameraSelect.value =
          preferred;


        await startCamera(
          preferred
        );

      } catch (error) {

        cameraStatus.textContent =
          'ERROR';

        setStatus(
          'Kamera tidak dapat dibuka',
          error.message ||
          'Izinkan akses kamera.',
          'error'
        );

      }

    }


    async function startCamera(
      index
    ) {

      if (
        !cameras[index]
      ) {
        return;
      }


      if (scanner) {

        try {
          await scanner.stop();
        } catch (_) {}

        try {
          await scanner.clear();
        } catch (_) {}
      }


      sent = false;


      scanner =
        new Html5Qrcode(
          'reader'
        );


      const cameraId =
        cameras[index].id;


      cameraStatus.textContent =
        'AKTIF';


      setStatus(
        'Scanner aktif',
        'Arahkan QR siswa ke kamera'
      );


      try {

        await scanner.start(
          cameraId,
          {
            fps: 15,

            qrbox: function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const size =
                Math.floor(
                  Math.min(
                    viewfinderWidth,
                    viewfinderHeight
                  ) * 0.70
                );

              return {
                width: size,
                height: size
              };

            },

            aspectRatio:
              1.0

          },

          onScanSuccess,

          function () {}
        );

      } catch (error) {

        cameraStatus.textContent =
          'ERROR';

        setStatus(
          'Kamera gagal',
          error.message ||
          'Tidak dapat memulai kamera.',
          'error'
        );

      }

    }


    async function onScanSuccess(
      decodedText
    ) {

      if (sent) return;

      const code =
        String(
          decodedText || ''
        ).trim();


      if (!code) return;


      sent = true;


      setStatus(
        'QR TERDETEKSI',
        code,
        'success'
      );


      try {

        if (scanner) {
          await scanner.stop();
        }

      } catch (_) {}


      /*
       * Kirim ID siswa ke
       * Google Apps Script.
       */

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'QR_ATTENDANCE',

            studentId:
              code
          },
          returnOrigin
        );

        setStatus(
          'SCAN BERHASIL',
          'Absensi sedang disimpan...',
          'success'
        );


        setTimeout(
          () => {

            try {
              window.close();
            } catch (_) {}

          },
          900
        );

      } else {

        setStatus(
          'Scanner berdiri sendiri',
          'Buka scanner melalui aplikasi absensi.',
          'error'
        );

      }

    }


    cameraSelect.addEventListener(
      'change',
      async function() {

        const index =
          Number(
            this.value
          );

        currentCameraIndex =
          index;

        await startCamera(
          index
        );

      }
    );


    switchCameraBtn.addEventListener(
      'click',
      async function() {

        if (
          cameras.length < 2
        ) {

          setStatus(
            'Kamera tidak tersedia',
            'Tidak ada kamera lain.',
            'error'
          );

          return;
        }


        currentCameraIndex =
          (
            currentCameraIndex + 1
          ) %
          cameras.length;


        cameraSelect.value =
          currentCameraIndex;


        await startCamera(
          currentCameraIndex
        );

      }
    );


    /*
     * Coba kamera belakang
     * terlebih dahulu pada perangkat
     * yang mendukung facingMode.
     *
     * Jika gagal, getCameras()
     * akan mencari daftar kamera.
     */

    async function initScanner() {

      try {

        if (
          /Android|iPhone|iPad|iPod/i
            .test(
              navigator.userAgent
            )
        ) {

          try {

            scanner =
              new Html5Qrcode(
                'reader'
              );

            await scanner.start(
              {
                facingMode:
                  {
                    exact:
                      'environment'
                  }
              },
              {
                fps: 15,
                qrbox: {
                  width: 260,
                  height: 260
                }
              },
              onScanSuccess,
              function () {}
            );


            cameraStatus.textContent =
              'AKTIF';

            setStatus(
              'Scanner aktif',
              'Kamera belakang digunakan.'
            );

            return;

          } catch (_) {

            try {

              await scanner.stop();

            } catch (__) {}

          }

        }


        await getCameras();

      } catch (error) {

        await getCameras();

      }

    }


    initScanner();

  </script>

</body>
</html>
