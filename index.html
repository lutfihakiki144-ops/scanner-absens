<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0">

  <title>Scanner QR Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
      padding: 15px;
    }

    .container {
      max-width: 450px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 18px;
      background: black;
    }

    .status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #1f2937;
      text-align: center;
    }

    .success {
      background: #166534;
    }

    .error {
      background: #991b1b;
    }

    .camera-select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 SCANNER QR</h1>

  <div class="subtitle">
    Scanner Absensi Siswa
  </div>


  <select
    id="cameraSelect"
    class="camera-select">

    <option value="">
      Mencari kamera...
    </option>

  </select>


  <div id="reader"></div>


  <div
    id="status"
    class="status">

    Meminta izin kamera...

  </div>

</div>


<script>

let scanner = null;

let cameras = [];

let alreadyScanned = false;


const params =
  new URLSearchParams(
    window.location.search
  );


const returnOrigin =
  params.get('returnOrigin') || '*';


const statusBox =
  document.getElementById('status');


const cameraSelect =
  document.getElementById('cameraSelect');


function setStatus(
  text,
  type = ''
) {

  statusBox.textContent = text;

  statusBox.className =
    'status ' + type;
}


/* =====================================================
   MULAI SCANNER
===================================================== */

async function startScanner() {

  try {

    setStatus(
      'Meminta izin kamera...'
    );


    // Memicu permission kamera
    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true
        });


    stream
      .getTracks()
      .forEach(function(track) {
        track.stop();
      });


    cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || !cameras.length) {

      setStatus(
        'Kamera tidak ditemukan.',
        'error'
      );

      return;
    }


    cameraSelect.innerHTML = '';


    cameras.forEach(function(camera, index) {

      const option =
        document.createElement('option');

      option.value =
        camera.id;

      option.textContent =
        camera.label ||
        'Kamera ' + (index + 1);

      cameraSelect.appendChild(option);

    });


    // Cari kamera belakang
    const backCamera =
      cameras.find(function(camera) {

        const label =
          String(
            camera.label || ''
          ).toLowerCase();

        return (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment') ||
          label.includes('belakang')
        );

      });


    if (backCamera) {

      cameraSelect.value =
        backCamera.id;

    }


    await launchCamera(
      cameraSelect.value
    );

  }

  catch (error) {

    console.error(error);

    setStatus(
      'Kamera tidak dapat dibuka. Pastikan izin kamera diberikan.',
      'error'
    );
  }
}


/* =====================================================
   LAUNCH CAMERA
===================================================== */

async function launchCamera(cameraId) {

  if (scanner) {

    try {
      await scanner.stop();
    } catch (e) {}

    try {
      await scanner.clear();
    } catch (e) {}

  }


  scanner =
    new Html5Qrcode('reader');


  setStatus(
    'Arahkan kamera ke QR siswa...'
  );


  await scanner.start(

    cameraId,

    {
      fps: 10,

      qrbox: {
        width: 260,
        height: 260
      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      if (alreadyScanned) {
        return;
      }


      alreadyScanned = true;


      setStatus(
        '✅ QR berhasil dibaca.',
        'success'
      );


      sendResult(
        decodedText
      );

    },

    function(errorMessage) {

      // Error scan biasa
      // sengaja tidak ditampilkan
    }

  );

}


/* =====================================================
   KIRIM KE APLIKASI ABSENSI
===================================================== */

function sendResult(value) {

  try {

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(

        {
          type: 'QR_ATTENDANCE',
          value: String(value).trim()
        },

        returnOrigin
      );


      setTimeout(function() {

        window.close();

      }, 500);

    }

    else {

      setStatus(
        'Aplikasi absensi tidak ditemukan. Buka scanner dari tombol SCAN QR di aplikasi.',
        'error'
      );

      alreadyScanned = false;

    }

  }

  catch (error) {

    console.error(error);

    setStatus(
      'Gagal mengirim hasil QR.',
      'error'
    );

    alreadyScanned = false;
  }
}


/* =====================================================
   GANTI KAMERA
===================================================== */

cameraSelect.addEventListener(
  'change',
  async function() {

    alreadyScanned = false;

    try {

      await launchCamera(
        cameraSelect.value
      );

    }

    catch (error) {

      console.error(error);

      setStatus(
        'Gagal mengganti kamera.',
        'error'
      );

    }

  }
);


/* =====================================================
   START
===================================================== */

window.addEventListener(
  'load',
  startScanner
);

</script>

</body>

</html>
