<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1.0">

<title>Scanner QR Absensi</title>

<script
src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  background: white;
  border-radius: 16px;
  overflow: hidden;
}

select,
button {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border-radius: 10px;
  font-size: 16px;
}

select {
  background: #222;
  color: white;
  border: 1px solid #444;
}

button {
  border: 0;
  background: #ffd400;
  color: #111;
  font-weight: bold;
}

.stop {
  background: #e53935;
  color: white;
}

#status {
  margin-top: 15px;
  padding: 13px;
  background: #222;
  border-radius: 10px;
  min-height: 45px;
}

</style>

</head>

<body>

<div class="container">

<h1>📷 SCANNER QR</h1>

<div class="subtitle">
Scanner QR Absensi Siswa
</div>

<select id="cameraSelect">

<option value="">
Pilih kamera
</option>

</select>

<div id="reader"></div>

<button onclick="startScanner()">
📷 MULAI KAMERA
</button>

<button
class="stop"
onclick="stopScanner()">

⛔ STOP

</button>

<div id="status">
Kamera belum dimulai.
</div>

</div>


<script>

const params =
new URLSearchParams(
  window.location.search
);

const returnOrigin =
params.get('returnOrigin') || '*';

let scanner = null;
let running = false;

let lastScan = '';
let lastScanTime = 0;


/* STATUS */

function setStatus(text) {

  document
    .getElementById('status')
    .textContent = text;

}


/* CAMERA */

async function loadCameras() {

  try {

    const cameras =
      await Html5Qrcode.getCameras();

    const select =
      document.getElementById(
        'cameraSelect'
      );

    select.innerHTML =
      '<option value="">Pilih kamera</option>';

    cameras.forEach(
      (camera, index) => {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        option.textContent =
          camera.label ||
          `Kamera ${index + 1}`;

        select.appendChild(
          option
        );

      }
    );

    if (cameras.length) {

      setStatus(
        'Kamera ditemukan. Tekan MULAI KAMERA.'
      );

    } else {

      setStatus(
        'Tidak ada kamera ditemukan.'
      );

    }

  } catch (error) {

    console.error(error);

    setStatus(
      'Tidak dapat membaca kamera. Izinkan akses kamera.'
    );

  }

}


/* START */

async function startScanner() {

  if (running) return;

  try {

    if (!window.isSecureContext) {

      setStatus(
        'Scanner harus dibuka melalui HTTPS.'
      );

      return;

    }

    scanner =
      new Html5Qrcode(
        'reader'
      );

    const selected =
      document.getElementById(
        'cameraSelect'
      ).value;

    const camera =
      selected ||
      {
        facingMode: {
          ideal: 'environment'
        }
      };

    await scanner.start(

      camera,

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      decodedText => {

        handleQr(decodedText);

      },

      errorMessage => {

        // Abaikan frame yang tidak memiliki QR.

      }

    );

    running = true;

    setStatus(
      '📷 Kamera aktif. Arahkan ke QR siswa.'
    );

  } catch (error) {

    console.error(error);

    setStatus(
      '❌ Kamera gagal dibuka. Pastikan izin kamera diberikan.'
    );

  }

}


/* QR */

function handleQr(value) {

  const now =
    Date.now();

  if (
    value === lastScan &&
    now - lastScanTime < 2000
  ) {

    return;

  }

  lastScan =
    value;

  lastScanTime =
    now;

  setStatus(
    '✅ QR terbaca: ' + value
  );

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          'QR_ATTENDANCE',

        value:
          value
      },

      returnOrigin

    );

  }

}


/* STOP */

async function stopScanner() {

  if (
    !scanner ||
    !running
  ) {

    return;

  }

  try {

    await scanner.stop();

    scanner.clear();

  } catch (error) {

    console.error(error);

  }

  running = false;

  setStatus(
    'Kamera dihentikan.'
  );

}


window.addEventListener(
  'load',
  loadCameras
);

</script>

</body>
</html>
