<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<meta
  name="theme-color"
  content="#0f766e">

<title>QR Scanner Absensi</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  min-height: 100vh;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(20,184,166,.25),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 90%,
      rgba(16,185,129,.2),
      transparent 35%
    ),
    #061b19;
}

.app {
  width: 100%;
  max-width: 520px;

  min-height: 100vh;

  margin: auto;

  padding: 18px;
}

.header {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 15px;
}

.title {
  font-size: 19px;
  font-weight: 900;
}

.subtitle {
  margin-top: 3px;

  color: rgba(255,255,255,.62);

  font-size: 11px;
}

.status {
  padding: 7px 10px;

  border-radius: 999px;

  color: #a7f3d0;

  background: rgba(16,185,129,.12);

  font-size: 10px;
  font-weight: 900;
}

.card {
  padding: 15px;

  border:
    1px solid rgba(255,255,255,.13);

  border-radius: 25px;

  background:
    rgba(255,255,255,.07);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.25);
}

#reader {
  width: 100%;

  overflow: hidden;

  border-radius: 19px;

  background: #000;
}

#reader video {
  width: 100% !important;

  border-radius: 19px;
}

.camera-controls {
  display: grid;

  grid-template-columns: 1fr;

  gap: 9px;

  margin-top: 12px;
}

select,
button {
  width: 100%;

  min-height: 46px;

  padding: 0 13px;

  border: 0;

  border-radius: 14px;

  font: inherit;
}

select {
  color: white;

  background: rgba(255,255,255,.1);

  outline: none;
}

select option {
  color: #111;
}

button {
  color: white;

  background:
    linear-gradient(
      135deg,
      #14b8a6,
      #0f766e
    );

  font-weight: 800;
}

button.secondary {
  background:
    rgba(255,255,255,.1);
}

.message {
  margin-top: 14px;

  padding: 13px;

  border-radius: 15px;

  color: rgba(255,255,255,.78);

  background:
    rgba(255,255,255,.06);

  text-align: center;

  font-size: 12px;
}

.message.success {
  color: #a7f3d0;

  background:
    rgba(16,185,129,.12);
}

.message.error {
  color: #fecaca;

  background:
    rgba(220,38,38,.12);
}

.result {
  display: none;

  margin-top: 15px;

  padding: 18px;

  text-align: center;

  border-radius: 20px;

  background:
    rgba(16,185,129,.11);

  border:
    1px solid rgba(16,185,129,.2);
}

.result.show {
  display: block;
}

.result-icon {
  font-size: 38px;

  margin-bottom: 7px;
}

.result-title {
  font-size: 17px;
  font-weight: 900;
}

.result-code {
  margin-top: 5px;

  color: rgba(255,255,255,.65);

  font-size: 12px;
}

.info {
  margin-top: 12px;

  color: rgba(255,255,255,.5);

  text-align: center;

  font-size: 10px;
  line-height: 1.6;
}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <div>
      <div class="title">
        QR ATTENDANCE
      </div>

      <div class="subtitle">
        Scanner Absensi Siswa
      </div>
    </div>

    <div
      id="status"
      class="status">
      STARTING
    </div>

  </div>


  <div class="card">

    <div id="reader"></div>


    <div class="camera-controls">

      <select id="cameraSelect">
        <option value="">
          Memuat kamera...
        </option>
      </select>

      <button
        id="switchCameraBtn"
        type="button">
        GANTI KAMERA
      </button>

    </div>


    <div
      id="message"
      class="message">
      Menyiapkan kamera...
    </div>


    <div
      id="result"
      class="result">

      <div class="result-icon">
        ✓
      </div>

      <div class="result-title">
        QR BERHASIL DIBACA
      </div>

      <div
        id="resultCode"
        class="result-code">
      </div>

    </div>

  </div>


  <div class="info">
    Arahkan kamera ke QR siswa.
    <br>
    Setelah QR terbaca, ID siswa langsung dikirim
    ke aplikasi absensi.
  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const returnOrigin =
  params.get('returnOrigin') ||
  '';


const scannerElementId =
  'reader';


let scanner = null;

let cameras = [];

let currentCameraId = null;

let scanning = false;

let sent = false;


/* ==================================================
   ELEMENT
================================================== */

const cameraSelect =
  document.getElementById(
    'cameraSelect'
  );

const switchCameraBtn =
  document.getElementById(
    'switchCameraBtn'
  );

const message =
  document.getElementById(
    'message'
  );

const status =
  document.getElementById(
    'status'
  );

const result =
  document.getElementById(
    'result'
  );

const resultCode =
  document.getElementById(
    'resultCode'
  );


/* ==================================================
   MESSAGE
================================================== */

function setMessage(
  text,
  type
) {

  message.textContent =
    text;

  message.className =
    'message' +
    (
      type
        ? ' ' + type
        : ''
    );
}


/* ==================================================
   VALIDATE ORIGIN
================================================== */

function validReturnOrigin() {

  if (!returnOrigin) {
    return false;
  }

  try {

    const url =
      new URL(returnOrigin);

    return (
      url.protocol === 'https:' ||
      url.hostname === 'localhost'
    );

  } catch (error) {

    return false;
  }
}


/* ==================================================
   GET CAMERAS
================================================== */

async function getCameras() {

  try {

    cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'Kamera tidak ditemukan.'
      );
    }


    cameraSelect.innerHTML = '';


    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        let label =
          camera.label ||
          ('Kamera ' + (index + 1));


        option.textContent =
          label;

        cameraSelect.appendChild(
          option
        );

      }
    );


    const preferred =
      findRearCamera(cameras);


    currentCameraId =
      preferred
        ? preferred.id
        : cameras[0].id;


    cameraSelect.value =
      currentCameraId;


    return cameras;

  } catch (error) {

    throw error;
  }
}


/* ==================================================
   FIND REAR CAMERA
================================================== */

function findRearCamera(list) {

  const patterns = [
    /back/i,
    /rear/i,
    /environment/i,
    /belakang/i,
    /traseira/i
  ];


  for (
    let i = 0;
    i < list.length;
    i++
  ) {

    const label =
      String(
        list[i].label || ''
      );

    if (
      patterns.some(
        function(pattern) {
          return pattern.test(label);
        }
      )
    ) {

      return list[i];
    }
  }


  return null;
}


/* ==================================================
   START
================================================== */

async function startScanner(
  cameraId
) {

  await stopScanner();


  scanner =
    new Html5Qrcode(
      scannerElementId
    );


  sent = false;

  scanning = true;


  status.textContent =
    'SCANNING';


  setMessage(
    'Kamera aktif. Arahkan ke QR siswa.'
  );


  try {

    await scanner.start(
      cameraId,
      {
        fps: 15,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * .72
            );

          return {
            width: Math.min(
              320,
              size
            ),
            height: Math.min(
              320,
              size
            )
          };

        },

        aspectRatio: 1.333334,

        disableFlip: false

      },

      onScanSuccess,

      onScanFailure

    );

  } catch (error) {

    scanning = false;

    status.textContent =
      'ERROR';

    setMessage(
      'Kamera gagal dibuka: ' +
      error.message,
      'error'
    );
  }
}


/* ==================================================
   STOP
================================================== */

async function stopScanner() {

  scanning = false;


  if (!scanner) {
    return;
  }


  try {

    if (
      scanner.isScanning
    ) {
      await scanner.stop();
    }

  } catch (error) {
    // abaikan
  }


  try {
    await scanner.clear();
  } catch (error) {
    // abaikan
  }


  scanner = null;
}


/* ==================================================
   SCAN SUCCESS
================================================== */

async function onScanSuccess(
  decodedText
) {

  if (sent) {
    return;
  }


  const code =
    String(
      decodedText || ''
    )
    .replace(/\s+/g, '')
    .trim()
    .toUpperCase();


  if (
    !/^S\d+$/i.test(code)
  ) {

    setMessage(
      'QR terbaca, tetapi bukan QR siswa yang valid.',
      'error'
    );

    return;
  }


  sent = true;


  result.classList.add(
    'show'
  );

  resultCode.textContent =
    code;


  status.textContent =
    'SUCCESS';


  setMessage(
    'QR berhasil dibaca. Mengirim ke aplikasi...',
    'success'
  );


  await stopScanner();


  if (!validReturnOrigin()) {

    setMessage(
      'Alamat aplikasi absensi tidak valid.',
      'error'
    );

    return;
  }


  if (
    !window.opener ||
    window.opener.closed
  ) {

    setMessage(
      'Aplikasi absensi utama tidak ditemukan.',
      'error'
    );

    return;
  }


  try {

    window.opener.postMessage(
      {
        type: 'QR_ATTENDANCE',
        studentId: code
      },
      returnOrigin
    );


    setMessage(
      'QR dikirim. Menyimpan absensi...',
      'success'
    );


    setTimeout(
      function() {

        try {
          window.close();
        } catch (error) {}

      },
      900
    );

  } catch (error) {

    setMessage(
      'Gagal mengirim QR ke aplikasi utama.',
      'error'
    );
  }
}


/* ==================================================
   SCAN FAILURE
================================================== */

function onScanFailure() {
  // Normal: kamera terus mencari QR.
}


/* ==================================================
   CAMERA SELECT
================================================== */

cameraSelect.addEventListener(
  'change',
  async function() {

    const id =
      cameraSelect.value;

    if (!id) {
      return;
    }

    currentCameraId =
      id;

    sent = false;

    await startScanner(id);
  }
);


/* ==================================================
   SWITCH CAMERA
================================================== */

switchCameraBtn.addEventListener(
  'click',
  async function() {

    if (
      cameras.length < 2
    ) {

      setMessage(
        'Browser hanya mendeteksi satu kamera.'
      );

      return;
    }


    let index =
      cameras.findIndex(
        function(camera) {
          return camera.id === currentCameraId;
        }
      );


    if (index < 0) {
      index = 0;
    }


    index =
      (index + 1) %
      cameras.length;


    currentCameraId =
      cameras[index].id;


    cameraSelect.value =
      currentCameraId;


    sent = false;


    await startScanner(
      currentCameraId
    );
  }
);


/* ==================================================
   START APP
================================================== */

async function init() {

  if (!validReturnOrigin()) {

    setMessage(
      'Scanner dibuka tanpa koneksi ke aplikasi absensi.',
      'error'
    );

    status.textContent =
      'OFFLINE';

    return;
  }


  try {

    await getCameras();

    await startScanner(
      currentCameraId
    );

  } catch (error) {

    status.textContent =
      'ERROR';

    setMessage(
      error.message ||
      'Tidak dapat menemukan kamera.',
      'error'
    );
  }
}


window.addEventListener(
  'beforeunload',
  function() {
    stopScanner();
  }
);


init();

</script>

</body>
</html>
