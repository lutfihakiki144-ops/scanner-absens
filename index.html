<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#071f1d"
  >

  <title>
    SILELET QR Scanner
  </title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      min-height: 100%;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(20,184,166,.20),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(59,130,246,.15),
          transparent 30%
        ),
        #071f1d;

      color: white;
    }

    body {
      min-height: 100vh;
    }

    .app {
      width: min(760px, 100%);

      min-height: 100vh;

      margin: auto;

      padding:
        18px 14px
        calc(
          24px +
          env(safe-area-inset-bottom)
        );
    }

    .glass {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.13),
          rgba(255,255,255,.055)
        );

      border:
        1px solid
        rgba(255,255,255,.16);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.28);

      backdrop-filter:
        blur(28px)
        saturate(140%);

      -webkit-backdrop-filter:
        blur(28px)
        saturate(140%);
    }

    header {
      border-radius: 26px;

      padding: 18px;

      margin-bottom: 14px;
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 16px;

      background:
        rgba(20,184,166,.18);

      border:
        1px solid
        rgba(45,212,191,.25);

      font-size: 24px;
    }

    .brand strong {
      display: block;

      font-size: 15px;

      letter-spacing: .8px;
    }

    .brand small {
      display: block;

      margin-top: 3px;

      color:
        rgba(255,255,255,.58);

      font-size: 10px;
    }

    .status {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      margin-top: 14px;

      padding: 7px 10px;

      border-radius: 999px;

      background:
        rgba(34,197,94,.10);

      color:
        #86efac;

      font-size: 9px;

      font-weight: 800;

      letter-spacing: .8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow:
        0 0 12px
        rgba(34,197,94,.9);
    }

    .scanner-card {
      border-radius: 30px;

      padding: 14px;

      overflow: hidden;
    }

    #reader {
      width: 100% !important;

      border: 0 !important;

      overflow: hidden;

      border-radius: 24px;

      background: #000;
    }

    #reader video {
      width: 100% !important;

      height: auto !important;

      border-radius: 24px;

      object-fit: cover;
    }

    #reader__scan_region {
      min-height: 320px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;
    }

    #reader__dashboard {
      display: none !important;
    }

    .scan-overlay {
      position: relative;

      margin-top: -320px;

      height: 320px;

      pointer-events: none;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .scan-frame {
      width: min(70vw, 260px);

      height: min(70vw, 260px);

      max-width: 260px;
      max-height: 260px;

      border: 2px solid
        rgba(45,212,191,.95);

      border-radius: 25px;

      box-shadow:
        0 0 0 999px
        rgba(0,0,0,.18),
        0 0 35px
        rgba(20,184,166,.35);

      position: relative;
    }

    .scan-frame::after {
      content: "";

      position: absolute;

      left: 8%;

      right: 8%;

      top: 50%;

      height: 2px;

      background:
        #2dd4bf;

      box-shadow:
        0 0 12px
        #2dd4bf;

      animation:
        scanline 1.8s
        ease-in-out
        infinite;
    }

    @keyframes scanline {

      0%,
      100% {
        transform:
          translateY(-90px);
      }

      50% {
        transform:
          translateY(90px);
      }

    }

    .controls {
      display: grid;

      grid-template-columns:
        repeat(2,1fr);

      gap: 9px;

      margin-top: 14px;
    }

    button {
      min-height: 50px;

      border: 0;

      border-radius: 16px;

      cursor: pointer;

      color: white;

      font-weight: 800;

      font-size: 11px;

      touch-action: manipulation;
    }

    .control-btn {
      background:
        rgba(255,255,255,.09);

      border:
        1px solid
        rgba(255,255,255,.13);
    }

    .control-btn.active {
      background:
        linear-gradient(
          145deg,
          #14b8a6,
          #0f766e
        );
    }

    .message {
      margin-top: 14px;

      min-height: 58px;

      border-radius: 18px;

      padding: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.10);

      color:
        rgba(255,255,255,.72);

      font-size: 11px;
    }

    .message.success {
      background:
        rgba(34,197,94,.12);

      color:
        #bbf7d0;

      border-color:
        rgba(34,197,94,.25);
    }

    .message.error {
      background:
        rgba(239,68,68,.12);

      color:
        #fecaca;

      border-color:
        rgba(239,68,68,.25);
    }

    .hint {
      text-align: center;

      color:
        rgba(255,255,255,.48);

      font-size: 9px;

      margin-top: 12px;
    }

    .loading {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;

      justify-content: center;

      background:
        rgba(0,0,0,.55);

      backdrop-filter:
        blur(8px);
    }

    .loading.show {
      display: flex;
    }

    .loading-card {
      padding: 24px;

      border-radius: 22px;

      text-align: center;
    }

    .spinner {
      width: 35px;
      height: 35px;

      margin: auto auto 12px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,.15);

      border-top-color:
        #2dd4bf;

      animation:
        spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    @media (max-width: 480px) {

      .app {
        padding:
          10px 9px
          calc(
            18px +
            env(safe-area-inset-bottom)
          );
      }

      header {
        border-radius: 22px;

        padding: 15px;
      }

      .scanner-card {
        padding: 9px;

        border-radius: 25px;
      }

      #reader__scan_region {
        min-height: 300px;
      }

      .scan-overlay {
        margin-top: -300px;

        height: 300px;
      }

      .scan-frame {
        width: 230px;
        height: 230px;
      }

    }

  </style>

</head>


<body>

<div class="app">

  <header class="glass">

    <div class="brand">

      <div class="brand-icon">
        ▣
      </div>

      <div>

        <strong>
          SILELET QR SCANNER
        </strong>

        <small>
          Scanner Absensi Siswa
        </small>

      </div>

    </div>

    <div class="status">

      <span class="status-dot"></span>

      CAMERA READY

    </div>

  </header>


  <main class="scanner-card glass">

    <div id="reader"></div>

    <div class="scan-overlay">
      <div class="scan-frame"></div>
    </div>

    <div class="controls">

      <button
        type="button"
        id="backCameraBtn"
        class="control-btn active"
      >
        📷 KAMERA BELAKANG
      </button>

      <button
        type="button"
        id="frontCameraBtn"
        class="control-btn"
      >
        🤳 KAMERA DEPAN
      </button>

    </div>


    <div
      id="message"
      class="message"
    >
      Mengaktifkan kamera...
    </div>

    <div class="hint">
      Arahkan QR siswa ke kotak scanner.
      Setelah QR terbaca, absensi langsung dikirim.
    </div>

  </main>

</div>


<div
  id="loading"
  class="loading"
>

  <div class="loading-card glass">

    <div class="spinner"></div>

    <strong>
      Mengirim absensi...
    </strong>

  </div>

</div>


<script>

const state = {

  scanner: null,

  running: false,

  starting: false,

  sent: false,

  cameraMode: 'environment',

  cameras: [],

  returnOrigin: '',

  lastText: '',

  lastTime: 0

};


/* =====================================================
   RETURN ORIGIN
===================================================== */

function getReturnOrigin() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const origin =
    params.get(
      'returnOrigin'
    );

  /*
   * Hanya menerima origin HTTPS/HTTP.
   */

  if (
    origin &&
    /^https?:\/\//i.test(origin)
  ) {
    return origin;
  }

  return '';
}


state.returnOrigin =
  getReturnOrigin();


/* =====================================================
   ELEMENT
===================================================== */

const message =
  document.getElementById(
    'message'
  );

const loading =
  document.getElementById(
    'loading'
  );

const backBtn =
  document.getElementById(
    'backCameraBtn'
  );

const frontBtn =
  document.getElementById(
    'frontCameraBtn'
  );


/* =====================================================
   MESSAGE
===================================================== */

function setMessage(
  text,
  type = ''
) {

  message.textContent =
    text;

  message.className =
    'message';

  if (type) {
    message.classList.add(
      type
    );
  }
}


/* =====================================================
   NORMALIZE QR
===================================================== */

function normalizeStudentId(
  text
) {

  let value =
    String(text || '')
      .trim();

  /*
   * QR dari sistem hanya berisi:
   * S001
   *
   * Tetapi tetap membersihkan newline/spasi.
   */

  value =
    value
      .replace(/\s+/g, '');

  return value;
}


/* =====================================================
   VALIDATE QR
===================================================== */

function validStudentId(
  value
) {

  return /^S\d+$/i.test(
    value
  );

}


/* =====================================================
   CAMERA PERMISSION
===================================================== */

async function requestCameraPermission() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      'Browser tidak mendukung kamera.'
    );

  }

  /*
   * Meminta permission terlebih dahulu.
   * Ini membantu terutama pada HP.
   */

  const stream =
    await navigator.mediaDevices
      .getUserMedia({
        video: {
          facingMode: {
            ideal:
              state.cameraMode
          }
        },
        audio: false
      });

  stream
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

}


/* =====================================================
   ENUMERATE CAMERA
===================================================== */

async function getCameras() {

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.enumerateDevices
  ) {
    return [];
  }

  const devices =
    await navigator.mediaDevices
      .enumerateDevices();

  return devices
    .filter(
      d =>
        d.kind ===
        'videoinput'
    );

}


/* =====================================================
   CAMERA SELECTION
===================================================== */

function findCamera(
  cameras,
  mode
) {

  if (!cameras.length) {
    return null;
  }

  const labels =
    cameras.map(
      c =>
        String(
          c.label || ''
        ).toLowerCase()
    );

  if (
    mode ===
    'environment'
  ) {

    const backIndex =
      labels.findIndex(
        label =>
          /back|rear|environment|belakang/.test(
            label
          )
      );

    if (backIndex >= 0) {
      return cameras[
        backIndex
      ];
    }

  } else {

    const frontIndex =
      labels.findIndex(
        label =>
          /front|user|facetime|depan/.test(
            label
          )
      );

    if (frontIndex >= 0) {
      return cameras[
        frontIndex
      ];
    }

  }

  /*
   * Fallback.
   */

  return mode ===
    'environment'
      ? cameras[
          cameras.length - 1
        ]
      : cameras[0];

}


/* =====================================================
   STOP
===================================================== */

async function stopScanner() {

  if (!state.scanner) {
    return;
  }

  try {

    if (
      state.running
    ) {

      await state.scanner.stop();

    }

  } catch (_) {}

  try {

    await state.scanner.clear();

  } catch (_) {}

  state.running =
    false;

  state.scanner =
    null;

}


/* =====================================================
   START SCANNER
===================================================== */

async function startScanner(
  mode
) {

  if (state.starting) {
    return;
  }

  state.starting =
    true;

  state.sent =
    false;

  state.cameraMode =
    mode;

  loading.classList.add(
    'show'
  );

  setMessage(
    'Mengaktifkan kamera...'
  );

  try {

    await stopScanner();

    /*
     * Minta izin kamera.
     */

    await requestCameraPermission();

    /*
     * Setelah permission didapat,
     * daftar kamera menjadi lebih lengkap.
     */

    state.cameras =
      await getCameras();

    let camera =
      findCamera(
        state.cameras,
        mode
      );

    state.scanner =
      new Html5Qrcode(
        'reader'
      );

    const config = {

      fps: 15,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * .68
          );

        return {
          width:
            Math.max(
              180,
              Math.min(
                size,
                300
              )
            ),

          height:
            Math.max(
              180,
              Math.min(
                size,
                300
              )
            )
        };

      },

      aspectRatio:
        1.333334,

      disableFlip: false

    };


    /*
     * PRIORITAS:
     *
     * 1. cameraId jika tersedia
     * 2. facingMode
     */

    if (camera) {

      await state.scanner.start(
        camera.id,
        config,
        onScanSuccess,
        onScanFailure
      );

    } else {

      await state.scanner.start(
        {
          facingMode: {
            ideal: mode
          }
        },
        config,
        onScanSuccess,
        onScanFailure
      );

    }

    state.running =
      true;

    setButtons();

    setMessage(
      mode === 'user'
        ? 'Kamera depan aktif. Arahkan QR ke kotak.'
        : 'Kamera belakang aktif. Arahkan QR ke kotak.'
    );

  } catch (error) {

    console.error(
      error
    );

    setMessage(
      'Kamera gagal dibuka: ' +
      (
        error.message ||
        error
      ),
      'error'
    );

  } finally {

    loading.classList.remove(
      'show'
    );

    state.starting =
      false;

  }

}


/* =====================================================
   SCAN SUCCESS
===================================================== */

async function onScanSuccess(
  decodedText
) {

  if (state.sent) {
    return;
  }

  const studentId =
    normalizeStudentId(
      decodedText
    );

  if (
    !validStudentId(
      studentId
    )
  ) {

    setMessage(
      'QR terbaca, tetapi bukan QR siswa yang valid.',
      'error'
    );

    return;
  }

  /*
   * Anti duplicate callback.
   */

  const now =
    Date.now();

  if (
    state.lastText ===
      studentId &&
    now - state.lastTime <
      3000
  ) {
    return;
  }

  state.lastText =
    studentId;

  state.lastTime =
    now;

  /*
   * LOCK SEBELUM STOP.
   */

  state.sent =
    true;

  loading.classList.add(
    'show'
  );

  setMessage(
    'QR terbaca: ' +
    studentId +
    '. Mengirim absensi...',
  );

  /*
   * Stop scanner terlebih dahulu
   * supaya callback tidak berulang.
   */

  try {

    await stopScanner();

  } catch (_) {}


  /*
   * KIRIM KE GOOGLE APPS SCRIPT
   */

  if (
    window.opener &&
    !window.opener.closed &&
    state.returnOrigin
  ) {

    try {

      window.opener.postMessage(
        {
          type:
            'QR_ATTENDANCE',

          studentId:
            studentId,

          source:
            'github-scanner',

          time:
            Date.now()
        },

        state.returnOrigin
      );

      setMessage(
        'Absensi dikirim. Silakan tunggu hasilnya.',
        'success'
      );

      /*
       * Beri waktu message sampai
       * diterima oleh Apps Script.
       */

      setTimeout(
        () => {

          try {
            window.close();
          } catch (_) {}

        },
        700
      );

      return;

    } catch (error) {

      console.error(
        error
      );

    }

  }

  /*
   * Jika scanner dibuka bukan sebagai popup
   * atau opener hilang.
   */

  loading.classList.remove(
    'show'
  );

  setMessage(
    'Scanner tidak terhubung ke aplikasi absensi. Buka scanner melalui tombol SCAN QR pada aplikasi.',
    'error'
  );

  state.sent =
    false;

}


/* =====================================================
   SCAN FAILURE
===================================================== */

function onScanFailure(
  errorMessage
) {

  /*
   * html5-qrcode memanggil callback ini
   * berkali-kali ketika belum menemukan QR.
   *
   * Jangan tampilkan error setiap frame.
   */

}


/* =====================================================
   BUTTON STATE
===================================================== */

function setButtons() {

  backBtn.classList.toggle(
    'active',
    state.cameraMode ===
      'environment'
  );

  frontBtn.classList.toggle(
    'active',
    state.cameraMode ===
      'user'
  );

}


/* =====================================================
   CAMERA BUTTON
===================================================== */

backBtn.addEventListener(
  'click',
  async function() {

    if (
      state.cameraMode ===
      'environment' &&
      state.running
    ) {
      return;
    }

    await startScanner(
      'environment'
    );

  }
);


frontBtn.addEventListener(
  'click',
  async function() {

    if (
      state.cameraMode ===
      'user' &&
      state.running
    ) {
      return;
    }

    await startScanner(
      'user'
    );

  }
);


/* =====================================================
   AUTO START
===================================================== */

window.addEventListener(
  'load',
  async function() {

    /*
     * Scanner langsung mencoba
     * kamera belakang terlebih dahulu.
     */

    await startScanner(
      'environment'
    );

  }
);


/* =====================================================
   PAGE EXIT
===================================================== */

window.addEventListener(
  'beforeunload',
  async function() {

    try {
      await stopScanner();
    } catch (_) {}

  }
);

</script>

</body>
</html>
