<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<meta
  name="theme-color"
  content="#0f766e"
>

<title>QR Scanner Absensi</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(16,185,129,.25),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(20,184,166,.2),
      transparent 35%
    ),
    #061a18;

  color: white;
}

body {
  padding: 12px;
}

.app {
  width: 100%;
  max-width: 520px;

  min-height:
    calc(100vh - 24px);

  margin: auto;

  padding: 15px;

  border-radius: 30px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid
    rgba(255,255,255,.13);

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.3);

  backdrop-filter:
    blur(30px);

  -webkit-backdrop-filter:
    blur(30px);
}

.header {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  margin-bottom: 15px;
}

.brand {
  display: flex;

  align-items: center;

  gap: 10px;
}

.logo {
  width: 45px;
  height: 45px;

  display: grid;

  place-items: center;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #10b981,
      #0f766e
    );

  font-size: 22px;

  font-weight: 900;
}

.title strong {
  display: block;

  font-size: 15px;
}

.title small {
  display: block;

  margin-top: 3px;

  color: #94b8b2;

  font-size: 10px;
}

.status {
  padding:
    7px 10px;

  border-radius: 999px;

  background:
    rgba(16,185,129,.12);

  color:
    #6ee7b7;

  font-size: 10px;

  font-weight: 800;
}

.scanner-card {
  overflow: hidden;

  border-radius: 25px;

  background:
    rgba(0,0,0,.22);

  border:
    1px solid
    rgba(255,255,255,.1);
}

#reader {
  width: 100%;

  min-height: 320px;
}

#reader video {
  border-radius: 20px;
}

#reader__dashboard {
  padding: 10px !important;
}

#reader__dashboard_section_csr button,
#reader__dashboard_section_swaplink {
  color: white !important;
}

.controls {
  margin-top: 13px;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;
}

select,
button {
  min-height: 45px;

  border-radius: 14px;

  font: inherit;
}

select {
  width: 100%;

  padding:
    10px;

  color: white;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.12);

  outline: none;
}

select option {
  background: #102c29;
}

button {
  padding:
    10px 15px;

  color: white;

  font-weight: 800;

  border:
    1px solid
    rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.08);

  cursor: pointer;
}

button.primary {
  background:
    linear-gradient(
      135deg,
      #10b981,
      #0f766e
    );

  border-color:
    transparent;
}

.message {
  margin-top: 14px;

  padding:
    14px;

  border-radius: 17px;

  background:
    rgba(255,255,255,.06);

  border:
    1px solid
    rgba(255,255,255,.08);

  color: #b8cfcb;

  text-align: center;

  font-size: 13px;
}

.success {
  color: #6ee7b7;

  background:
    rgba(16,185,129,.1);

  border-color:
    rgba(16,185,129,.2);
}

.error {
  color: #fca5a5;

  background:
    rgba(239,68,68,.1);

  border-color:
    rgba(239,68,68,.2);
}

.info {
  margin-top: 15px;

  color: #76938f;

  text-align: center;

  font-size: 10px;

  line-height: 1.6;
}

.hidden {
  display: none !important;
}

</style>

</head>


<body>

<div class="app">

  <div class="header">

    <div class="brand">

      <div class="logo">
        QR
      </div>

      <div class="title">
        <strong>QR ABSENSI</strong>
        <small>Scanner Kehadiran Siswa</small>
      </div>

    </div>

    <div
      id="status"
      class="status"
    >
      CAMERA
    </div>

  </div>


  <div class="scanner-card">

    <div id="reader"></div>

  </div>


  <div class="controls">

    <select id="cameraSelect">
      <option value="">
        Memuat kamera...
      </option>
    </select>

    <button
      id="switchBtn"
      type="button"
      class="primary"
    >
      ↻ GANTI KAMERA
    </button>

  </div>


  <div
    id="message"
    class="message"
  >
    Mengaktifkan kamera...
  </div>


  <div class="info">
    Arahkan kamera ke QR Code siswa.<br>
    Setelah QR terbaca, absensi langsung dikirim ke sistem.
  </div>

</div>


<script>

'use strict';


/* =====================================================
   STATE
===================================================== */

const state = {

  scanner: null,

  cameras: [],

  currentCamera: null,

  running: false,

  sent: false,

  returnOrigin: '',

  fallbackStarted: false

};


/* =====================================================
   ELEMENTS
===================================================== */

const reader =
  document.getElementById('reader');

const cameraSelect =
  document.getElementById('cameraSelect');

const switchBtn =
  document.getElementById('switchBtn');

const message =
  document.getElementById('message');

const status =
  document.getElementById('status');


/* =====================================================
   URL
===================================================== */

function getReturnOrigin() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get('returnOrigin') ||
    ''
  );

}


/* =====================================================
   MESSAGE
===================================================== */

function setMessage(
  text,
  type
) {

  message.textContent =
    text || '';

  message.className =
    'message ' +
    (type || '');

}


/* =====================================================
   CAMERA LIST
===================================================== */

async function loadCameras() {

  try {

    state.cameras =
      await Html5Qrcode.getCameras();


    if (
      !state.cameras ||
      !state.cameras.length
    ) {

      throw new Error(
        'Tidak ada kamera yang ditemukan.'
      );

    }


    cameraSelect.innerHTML = '';


    state.cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        option.textContent =
          camera.label ||
          ('Kamera ' + (index + 1));

        cameraSelect.appendChild(
          option
        );

      }
    );


    const preferred =
      choosePreferredCamera(
        state.cameras
      );


    cameraSelect.value =
      preferred.id;


    await startCamera(
      preferred.id
    );


  } catch (error) {

    console.error(error);

    setMessage(
      'Kamera belum dapat diakses. Izinkan kamera pada browser.',
      'error'
    );

    status.textContent =
      'KAMERA ERROR';


    await startFallback();

  }

}


/* =====================================================
   PREFER CAMERA
===================================================== */

function choosePreferredCamera(
  cameras
) {

  const text =
    cameras
      .map(function(c) {
        return {
          camera: c,
          label:
            String(
              c.label || ''
            ).toLowerCase()
        };
      });


  const back =
    text.find(function(x) {

      return (
        x.label.includes('back') ||
        x.label.includes('rear') ||
        x.label.includes('environment') ||
        x.label.includes('belakang')
      );

    });


  if (back) {
    return back.camera;
  }


  return cameras[0];

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(
  cameraId
) {

  state.sent = false;


  await stopScanner();


  state.scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps: 15,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const min =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );

      const size =
        Math.max(
          180,
          Math.min(
            300,
            Math.floor(
              min * 0.72
            )
          )
        );

      return {
        width: size,
        height: size
      };

    },

    aspectRatio: 1.0,

    disableFlip: false

  };


  try {

    await state.scanner.start(
      cameraId,
      config,
      onScanSuccess,
      onScanError
    );


    state.running = true;

    state.currentCamera =
      cameraId;

    state.fallbackStarted =
      false;


    status.textContent =
      'CAMERA AKTIF';

    setMessage(
      'Kamera aktif. Arahkan ke QR siswa.',
      'info'
    );


  } catch (error) {

    console.error(error);

    setMessage(
      'Kamera gagal dimulai: ' +
      error.message,
      'error'
    );

    await startFallback();

  }

}


/* =====================================================
   FALLBACK FACING MODE
===================================================== */

async function startFallback() {

  if (state.fallbackStarted) {
    return;
  }

  state.fallbackStarted = true;

  await stopScanner();


  state.scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps: 15,

    qrbox: {
      width: 260,
      height: 260
    },

    aspectRatio: 1.0,

    disableFlip: false

  };


  try {

    await state.scanner.start(

      {
        facingMode:
          'environment'
      },

      config,

      onScanSuccess,

      onScanError

    );


    state.running = true;

    status.textContent =
      'CAMERA AKTIF';

    setMessage(
      'Kamera aktif. Arahkan ke QR siswa.',
      'info'
    );


  } catch (error) {

    console.error(error);

    status.textContent =
      'KAMERA GAGAL';

    setMessage(
      'Tidak dapat membuka kamera. Pastikan izin kamera diberikan dan halaman menggunakan HTTPS.',
      'error'
    );

  }

}


/* =====================================================
   STOP
===================================================== */

async function stopScanner() {

  if (!state.scanner) {
    return;
  }


  try {

    if (state.running) {
      await state.scanner.stop();
    }

  } catch (_) {}


  try {
    await state.scanner.clear();
  } catch (_) {}


  state.scanner = null;

  state.running = false;

}


/* =====================================================
   QR SUCCESS
===================================================== */

async function onScanSuccess(
  decodedText
) {

  if (state.sent) {
    return;
  }


  const code =
    String(
      decodedText || ''
    )
      .trim()
      .replace(/\s+/g, '')
      .toUpperCase();


  if (!/^S\d+$/i.test(code)) {

    setMessage(
      'QR terbaca, tetapi bukan QR siswa yang valid.',
      'error'
    );

    return;
  }


  state.sent = true;


  setMessage(
    'QR ' +
    code +
    ' terbaca. Mengirim ke sistem...',
    'info'
  );


  await stopScanner();


  if (
    !window.opener ||
    window.opener.closed
  ) {

    setMessage(
      'Jendela aplikasi utama tidak ditemukan.',
      'error'
    );

    state.sent = false;

    return;
  }


  if (!state.returnOrigin) {

    setMessage(
      'Alamat aplikasi utama tidak ditemukan.',
      'error'
    );

    state.sent = false;

    return;
  }


  try {

    window.opener.postMessage(
      {
        type:
          'QR_ATTENDANCE',

        studentId:
          code
      },

      state.returnOrigin
    );


    status.textContent =
      'TERKIRIM';


    setMessage(
      'QR berhasil dikirim. Absensi sedang diproses...',
      'success'
    );


    setTimeout(
      function() {

        try {
          window.close();
        } catch (_) {}

      },
      900
    );


  } catch (error) {

    console.error(error);

    state.sent = false;

    setMessage(
      'Gagal mengirim hasil scan.',
      'error'
    );

  }

}


/* =====================================================
   SCAN ERROR
===================================================== */

function onScanError(errorMessage) {

  // Error scan normal tidak ditampilkan
  // agar scanner tetap cepat.

}


/* =====================================================
   CAMERA SWITCH
===================================================== */

switchBtn.addEventListener(
  'click',
  async function() {

    if (
      !state.cameras.length
    ) {
      await loadCameras();
      return;
    }


    const current =
      cameraSelect.value;


    const index =
      state.cameras.findIndex(
        function(c) {
          return c.id === current;
        }
      );


    const nextIndex =
      index >= 0
        ? (index + 1) %
          state.cameras.length
        : 0;


    const next =
      state.cameras[nextIndex];


    cameraSelect.value =
      next.id;


    await startCamera(
      next.id
    );

  }
);


cameraSelect.addEventListener(
  'change',
  async function() {

    if (
      !cameraSelect.value
    ) {
      return;
    }


    await startCamera(
      cameraSelect.value
    );

  }
);


/* =====================================================
   START
===================================================== */

state.returnOrigin =
  getReturnOrigin();


if (!state.returnOrigin) {

  setMessage(
    'Scanner dibuka tanpa aplikasi utama. Buka scanner melalui tombol SCAN QR pada aplikasi absensi.',
    'error'
  );

}


window.addEventListener(
  'load',
  function() {

    loadCameras();

  }
);


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    stopScanner();

  }
);

</script>

</body>
</html>
