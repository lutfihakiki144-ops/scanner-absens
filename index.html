<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>QR Scanner Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    :root {
      --green:#18c77a;
      --green-dark:#0b9e5b;
      --text:#111b16;
      --muted:#718078;
    }

    * {
      box-sizing:border-box;
    }

    body {

      margin:0;

      min-height:100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        Arial,
        sans-serif;

      color:var(--text);

      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(24,199,122,.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 80%,
          rgba(22,136,255,.14),
          transparent 30%
        ),
        linear-gradient(
          145deg,
          #edf8f3,
          #e7f1ee
        );

      padding:15px;
    }

    .glass {

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.76),
          rgba(255,255,255,.45)
        );

      border:
        1px solid
        rgba(255,255,255,.85);

      box-shadow:
        0 20px 50px
        rgba(20,60,40,.12);

      backdrop-filter:
        blur(28px);

      -webkit-backdrop-filter:
        blur(28px);
    }

    .scanner-card {

      width:
        min(500px,100%);

      margin:
        0 auto;

      padding:
        22px;

      border-radius:
        30px;
    }

    .header {

      display:
        flex;

      align-items:
        center;

      gap:
        11px;

      margin-bottom:
        18px;
    }

    .icon {

      width:
        46px;

      height:
        46px;

      border-radius:
        16px;

      display:
        grid;

      place-items:
        center;

      color:
        white;

      background:
        linear-gradient(
          145deg,
          #2be890,
          #0baa61
        );

      font-size:
        23px;

      font-weight:
        800;
    }

    h1 {

      margin:
        0;

      font-size:
        19px;

      letter-spacing:
        -.03em;
    }

    .subtitle {

      color:
        var(--muted);

      font-size:
        10px;

      margin-top:
        3px;
    }

    #reader {

      overflow:
        hidden;

      border-radius:
        23px;

      background:
        rgba(255,255,255,.65);

      border:
        1px solid
        rgba(255,255,255,.85);
    }

    #reader video {

      border-radius:
        20px;
    }

    .status {

      margin-top:
        13px;

      padding:
        13px;

      border-radius:
        17px;

      background:
        rgba(255,255,255,.5);

      text-align:
        center;

      font-size:
        11px;

      color:
        var(--muted);
    }

    .camera-controls {

      display:
        flex;

      gap:
        8px;

      margin-top:
        10px;
    }

    select,
    button {

      width:
        100%;

      min-height:
        45px;

      border-radius:
        15px;

      border:
        1px solid
        rgba(255,255,255,.85);

      background:
        rgba(255,255,255,.65);

      font:
        inherit;

      padding:
        0 13px;
    }

    button {

      background:
        linear-gradient(
          145deg,
          #28db89,
          #0dae62
        );

      color:
        white;

      font-weight:
        750;

      cursor:
        pointer;
    }

    .success {

      color:
        #07834b;

      background:
        rgba(220,250,233,.75);
    }

    .error {

      color:
        #b52d25;

      background:
        rgba(255,225,222,.75);
    }

    .scan-line {

      position:
        relative;
    }

    .scan-line::after {

      content:
        "";

      position:
        absolute;

      left:
        15%;

      right:
        15%;

      top:
        50%;

      height:
        2px;

      background:
        var(--green);

      box-shadow:
        0 0 15px
        var(--green);

      animation:
        scan 2s infinite ease-in-out;

      pointer-events:
        none;
    }

    @keyframes scan {

      0%,100% {
        transform:
          translateY(-90px);
      }

      50% {
        transform:
          translateY(90px);
      }

    }

  </style>

</head>

<body>

  <div class="scanner-card glass">

    <div class="header">

      <div class="icon">
        ✓
      </div>

      <div>

        <h1>
          QR ABSENSI
        </h1>

        <div class="subtitle">
          iOS Glass Scanner
        </div>

      </div>

    </div>


    <div
      id="reader"
      class="scan-line"
    ></div>


    <div
      id="status"
      class="status"
    >
      Menyiapkan kamera...
    </div>


    <div class="camera-controls">

      <select id="cameraSelect">
        <option>
          Memuat kamera...
        </option>
      </select>

      <button id="switchButton">
        ↻
      </button>

    </div>

  </div>


<script>

let scanner = null;

let cameras = [];

let currentCamera = 0;

let locked = false;

const statusBox =
  document.getElementById('status');

const cameraSelect =
  document.getElementById('cameraSelect');

const switchButton =
  document.getElementById('switchButton');


function setStatus(
  text,
  type = ''
) {

  statusBox.textContent = text;

  statusBox.className =
    'status ' + type;
}


async function getCameras() {

  try {

    cameras =
      await Html5Qrcode
        .getCameras();

    if (!cameras.length) {

      setStatus(
        'Kamera tidak ditemukan.',
        'error'
      );

      return;
    }

    cameraSelect.innerHTML = '';

    cameras.forEach(
      (camera, index) => {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        option.textContent =
          camera.label ||
          `Kamera ${index + 1}`;

        cameraSelect.appendChild(
          option
        );

      }
    );

    const rearIndex =
      cameras.findIndex(
        camera => {

          const label =
            (camera.label || '')
              .toLowerCase();

          return (
            label.includes('back') ||
            label.includes('rear') ||
            label.includes('environment') ||
            label.includes('belakang')
          );

        }
      );

    currentCamera =
      rearIndex >= 0
        ? rearIndex
        : 0;

    cameraSelect.value =
      cameras[currentCamera].id;

    startCamera(
      cameras[currentCamera].id
    );

  } catch (error) {

    setStatus(
      'Kamera tidak dapat diakses. Pastikan izin kamera diberikan.',
      'error'
    );

  }

}


async function startCamera(cameraId) {

  locked = false;

  if (scanner) {

    try {
      await scanner.stop();
    } catch (e) {}

    try {
      await scanner.clear();
    } catch (e) {}

  }

  scanner =
    new Html5Qrcode(
      'reader'
    );

  setStatus(
    'Kamera aktif. Arahkan ke QR siswa...'
  );

  try {

    await scanner.start(

      cameraId,

      {
        fps: 15,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      decodedText => {

        if (locked) {
          return;
        }

        locked = true;

        handleQR(
          decodedText
        );

      },

      () => {}

    );

  } catch (error) {

    setStatus(
      'Gagal membuka kamera. Periksa izin kamera browser.',
      'error'
    );

  }

}


function handleQR(value) {

  const studentId =
    String(value || '')
      .trim()
      .toUpperCase();

  if (!studentId) {

    locked = false;

    return;
  }

  setStatus(
    `QR terbaca: ${studentId}. Menyimpan...`
  );

  const targetOrigin =
    new URLSearchParams(
      location.search
    ).get('returnOrigin') ||
    '*';

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          'QR_ATTENDANCE',

        studentId:
          studentId,

        value:
          studentId,

        timestamp:
          Date.now()
      },

      targetOrigin

    );

    setStatus(
      `QR ${studentId} berhasil dikirim.`,
      'success'
    );

    setTimeout(() => {

      window.close();

    }, 800);

  } else {

    setStatus(
      `QR terbaca: ${studentId}`,
      'success'
    );

    locked = false;
  }

}


cameraSelect.onchange =
  () => {

    const id =
      cameraSelect.value;

    const index =
      cameras.findIndex(
        c => c.id === id
      );

    if (index >= 0) {
      currentCamera = index;
    }

    startCamera(id);

  };


switchButton.onclick =
  () => {

    if (!cameras.length) {
      return;
    }

    currentCamera =
      (currentCamera + 1)
      % cameras.length;

    const id =
      cameras[currentCamera].id;

    cameraSelect.value =
      id;

    startCamera(id);

  };


document.addEventListener(
  'DOMContentLoaded',
  getCameras
);

</script>

</body>
</html>
